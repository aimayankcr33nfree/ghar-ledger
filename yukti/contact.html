    <h1 style="margin-top:8px" data-hi="बात करें।">Talk to us.</h1>
    <p class="lead" style="margin-top:14px" data-hi="ऑर्डर, डीलर रेट, निरीक्षण प्रति या किसी ग़लती की सूचना — WhatsApp सबसे तेज़ है।">Orders, dealer terms, inspection copies or an error report — WhatsApp is fastest.</p>

    <label data-hi="नाम">Name<input name="name" required></label>
    <label data-hi="मोबाइल (WhatsApp)">Mobile (WhatsApp)<input name="phone" inputmode="numeric" required placeholder="10 digits" data-ph="10 अंक"></label>
    <label data-hi="संदेश">Message<textarea name="note" required></textarea></label>
    <button class="btn saff" type="submit" data-hi="भेजें">Send</button>
    <div class="ok" data-hi="धन्यवाद।">Thank you.</div>
