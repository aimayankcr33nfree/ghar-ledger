name: Ghar reminders
on:
  schedule:
    - cron: '30 3 * * *'    # 9:00 IST daily — dues + per-day
    - cron: '30 15 * * *'   # 21:00 IST daily — nudge if nothing logged
    - cron: '30 12 * * 0'   # Sunday 18:00 IST — weekly summary
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning | evening | weekly | test'
        default: 'test'
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT; exit 0; fi
          H=$(date -u +%H); W=$(date -u +%u)
          if [ "$H" = "03" ]; then echo "mode=morning" >> $GITHUB_OUTPUT;
          elif [ "$H" = "15" ]; then echo "mode=evening" >> $GITHUB_OUTPUT;
          else echo "mode=weekly" >> $GITHUB_OUTPUT; fi
      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: https://hwycxdeqxrcudtobwgex.supabase.co
          SUPABASE_KEY: sb_publishable_O8kFpMgViIvgMFE2sTtrEw_Rv7FXa0R
        run: node bot/remind.mjs "${{ steps.mode.outputs.mode }}"
