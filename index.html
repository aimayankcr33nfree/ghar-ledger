    + `<div class="field"><label for="in-festf">${t('festfrom')}</label><input id="in-festf" type="date" value="${f.from||''}"></div>`
    + `<div class="field"><label for="in-festt">${t('festto')}</label><input id="in-festt" type="date" value="${f.to||''}"></div>`;
  document.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=async ()=>{ const f = plan.fixed[+b.dataset.fdel]; if(!f) return; if((plan.helpers||[]).some(h=>h.fixedId===f.id)){ toast(t('fdelhelper')); return; } const ok = await ask({title:`${t('remove')} · ${nm(f)}?`, sub:t('fdelsub'), okText:t('remove'), danger:true}); if(!ok) return; plan.fixed.splice(+b.dataset.fdel,1); setDirty=false; saveCfg(); renderSettings(); renderHome(); toast(t('deleted')); });
  document.getElementById('f-pin').innerHTML = `<div class="field"><label for="in-pin">${(plan.pinHash||plan.pin) ? t('pinset') : t('pinfield')}</label><input id="in-pin" inputmode="numeric" maxlength="4" autocomplete="off" value="" placeholder="${(plan.pinHash||plan.pin) ? '••••' : t('pinnew')}">${(plan.pinHash||plan.pin) ? `<button class="chip" id="pin-off">${t('pinoff')}</button>` : ''}</div>`;
  { const po = document.getElementById('pin-off'); if(po) po.onclick = async ()=>{ const ok = await ask({title:t('pinoff')+'?', okText:t('pinoff'), danger:true}); if(!ok) return; delete plan.pin; delete plan.pinHash; saveCfg(); renderSettings(); toast('✓'); }; }

document.getElementById('l-hi').onclick = ()=>setLang('hi'); document.getElementById('l-en').onclick = ()=>setLang('en');

document.getElementById('save-set').onclick = async ()=>{
  const v = id => numIn(document.getElementById(id).value)||0;
  plan.income = v('in-income'); plan.emergency.plan = v('in-emer');
  plan.sips.forEach((s,i)=>{ s.name = document.getElementById('in-sipn'+i).value || s.name; s.plan = v('in-sip'+i); });
  plan.provisions.forEach((p,i)=>p.plan=v('in-prov'+i));
  plan.emerTarget = v('in-target'); plan.provCarry = plan.provCarry || {}; plan.provisions.forEach((p,i)=>{ plan.provCarry[p.key] = v('in-carry'+i); });
  // the user types the total so far (including this month); store the part that was there before this month
  corpus = { emergencyBase: Math.max(0, v('in-c-emer') - pastBab.emer - (plan.emergency.done?plan.emergency.plan:0)), sipBase: Math.max(0, v('in-c-sip') - pastBab.sip - sipTicked(plan)) };
  plan.fixed.forEach((f,i)=>{ const n = document.getElementById('in-fn'+i).value; if(lang==='hi') f.hi=n; else f.name=n; f.due=v('in-fd'+i); f.amt=v('in-fa'+i); const g = document.getElementById('in-fg'+i); if(g) f.grp = g.value; });
  plan.jars.forEach((j,i)=>{ j.plan=v('in-jar'+i); const g = document.getElementById('in-jg'+i); if(g) j.grp = g.value; });
  (plan.helpers||[]).forEach((h,i)=>{ const n = document.getElementById('in-hn'+i).value.trim(); if(n){ if(lang==='hi') h.hi = n; else h.name = n; }
    if(h.mode==='daily'){ h.rate = parseFloat(document.getElementById('in-hr'+i).value.replace(',', '.'))||0; h.qty = parseFloat(document.getElementById('in-hq'+i).value.replace(',', '.'))||0; } });
  const pv = (document.getElementById('in-pin').value||'').replace(/\D/g,'');
  if(pv.length!==0 && pv.length!==4){ toast('⚠ ' + t('pinbad')); return; }
  if(pv){ delete plan.pin; plan.pinHash = await pinHash(pv); try{ localStorage.setItem('gl-pin-ok', plan.pinHash); }catch(e){} }
  const fn = document.getElementById('in-festn').value.trim(), ff = document.getElementById('in-festf').value, ft = document.getElementById('in-festt').value;
  plan.festival = (ff && ft && ft >= ff) ? {name: fn || t('festival'), from: ff, to: ft} : null;
  setDirty = false; saveCfg(); renderAll(); toast('✓ ' + t('settingssaved'));
};

/* ---------- Excel export (all months, one file) ---------- */
document.getElementById('export-x').onclick = exportExcel;
function loadScript(src){ return new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = ()=>rej(new Error('download')); document.head.appendChild(s); }); }
const catLabel = c => c==='in' ? t('moneyin') : c==='prov' ? t('potwithdraw') : c==='bab' ? t('babshort') : c==='fix' ? t('fixed') : c==='up' ? t('upcoming') : t('variable');
function basePlanFor(key){ const P = JSON.parse(JSON.stringify(plan)); const [ky,km] = key.split('-').map(Number); const endTs = new Date(ky, km, 1).getTime();
  const born = id => { const m = /^(?:env|f)([0-9a-z]+)$/.exec(String(id||'')); if(!m) return 0; const n = String(id).startsWith('env') ? parseInt(m[1],36) : parseInt(m[1],10); return isNaN(n) ? 0 : n; };
  P.provisions = P.provisions.filter(x=>!(born(x.key) > endTs)); P.fixed = P.fixed.filter(f=>!(born(f.id) > endTs));
  P.emergency.done = false; P.sips.forEach(q=>q.done=false); P.provDone = false; P.provisions.forEach(x=>x.done=false); delete P.pinHash; delete P.pin; return P; }
async function exportExcel(){
  const btn = document.getElementById('export-x'); btn.disabled = true; toast(t('exporting'));
  try{
    if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    let months = [], ents = [];
    if(sb){ const m = await sb.from('months').select('*'); months = m.data||[]; const e = await sb.from('entries').select('*'); ents = (e.data||[]).filter(x=>!String(x.month||'').startsWith('Y-') && x.cat!=='yk'); }
    else { months = [{id:MKEY, data:{plan, corpus, paid, inflows}}]; ents = entries.map(e=>({id:e.id, month:MKEY, ts:e.ts, day:e.day, cat:e.cat, cat_id:e.catId, amt:e.amt, who:e.by, note:e.note, photo:e.photo})); }
    months.sort((a,b)=>a.id<b.id?-1:1); ents.sort((a,b)=>(a.month+pad2(a.day))<(b.month+pad2(b.day))?-1:(a.month+pad2(a.day))>(b.month+pad2(b.day))?1:(a.ts||0)-(b.ts||0));
    const planOf = mk => ((months.find(m=>m.id===mk)||{}).data||{}).plan || plan;
    const dOf = ts => { if(!ts) return ''; const d = new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
    const Entries = ents.map(e=>({[t('xl_for')]:`${e.month}-${pad2(e.day)}`, [t('xl_month')]:e.month, [t('xl_paidon')]: e.cat==='up' ? '' : dOf(e.ts), [t('xl_type')]:catLabel(e.cat), [t('xl_item')]:entryNameP(fromRow(e), planOf(e.month)), [t('xl_amt')]:e.amt, [t('xl_who')]:e.who||'', [t('xl_note')]:e.note||'', [t('xl_photo')]:e.photo||''}));
    const FixedBab = [], MoneyIn = [], Months = [];
    const allKeys = Array.from(new Set(months.map(m=>m.id).concat(ents.filter(e=>e.cat!=='up').map(e=>e.month)))).sort();
    allKeys.forEach(k=>{ if(!months.find(m=>m.id===k)) months.push({id:k, data:{plan: k===MKEY ? JSON.parse(JSON.stringify(plan)) : basePlanFor(k), paid:{}, inflows:[]}}); }); months.sort((a,b)=>a.id<b.id?-1:1);
    months.forEach(m=>{ const d = m.data||{}; const P = d.plan; if(!P) return;
      Object.entries(d.paid||{}).forEach(([id,p])=>{ const f = P.fixed.find(x=>x.id===id); FixedBab.push({[t('xl_paidon')]:`${m.id}-${pad2(p.day||1)}`, [t('xl_month')]:m.id, [t('xl_type')]:t('fixed'), [t('xl_item')]:f?nm(f):id, [t('xl_amt')]:p.amt||0, [t('xl_who')]:p.by||'', [t('xl_note')]:p.note||''}); });
      if(P.emergency.done) FixedBab.push({[t('xl_paidon')]:`${m.id}-01`, [t('xl_month')]:m.id, [t('xl_type')]:t('babshort'), [t('xl_item')]:t('emerg'), [t('xl_amt')]:P.emergency.plan, [t('xl_who')]:'', [t('xl_note')]:''});
      P.sips.forEach(s=>{ if(s.done) FixedBab.push({[t('xl_paidon')]:`${m.id}-01`, [t('xl_month')]:m.id, [t('xl_type')]:t('babshort'), [t('xl_item')]:'SIP · '+s.name, [t('xl_amt')]:s.plan, [t('xl_who')]:'', [t('xl_note')]:''}); });
      P.provisions.forEach(x=>{ if(x.done||P.provDone) FixedBab.push({[t('xl_paidon')]:`${m.id}-01`, [t('xl_month')]:m.id, [t('xl_type')]:t('babshort'), [t('xl_item')]:t('prov')+' · '+envName(x), [t('xl_amt')]:x.plan, [t('xl_who')]:'', [t('xl_note')]:''}); });
      (d.inflows||[]).forEach(x=>MoneyIn.push({[t('xl_paidon')]:`${m.id}-${pad2(x.day||1)}`, [t('xl_month')]:m.id, [t('xl_amt')]:x.amt||0, [t('fromwho')]:x.note||'', [t('xl_who')]:x.by||''}));
      const C = calc({plan:P, paid:d.paid||{}, inflows:d.inflows||[], entries:ents.filter(e=>e.month===m.id && e.cat!=='up').map(fromRow)});
      const MSx = monthSaving({key:m.id, live:m.id===MKEY, plan:P, paid:d.paid||{}, inflows:d.inflows||[], entries:ents.filter(e=>e.month===m.id && e.cat!=='up').map(fromRow), closed:d.closed}, C);
      Months.push({[t('xl_month')]:m.id, [t('income')]:C.income, [t('received')]:C.received, [t('xl_plan')]:C.totalPlan, [t('spent')]:C.out, [t('xl_invest')]:C.babActual, [t('envsec')]:C.envActual, [t('fixed')]:C.fixActual, [t('variable')]:C.jars.reduce((a,j)=>a+j.actual,0), [t('potwithdraw')]:C.potsUsed, [t('monthsaving')]: MSx.known ? MSx.left : '', [t('xl_saved')]: MSx.known ? MSx.total : '', [t('xl_savedhow')]: t('sk_'+MSx.kind), [t('closed')]: d.closed ? '✓' : ''});
    });
    const Plan = [];
    Plan.push({[t('xl_type')]:t('inc'), [t('xl_item')]:t('income'), [t('xl_plan')]:plan.income});
    Plan.push({[t('xl_type')]:t('babshort'), [t('xl_item')]:t('emerg'), [t('xl_plan')]:plan.emergency.plan});
    plan.sips.forEach(s=>Plan.push({[t('xl_type')]:t('babshort'), [t('xl_item')]:'SIP · '+s.name, [t('xl_plan')]:s.plan}));
    plan.provisions.forEach(x=>Plan.push({[t('xl_type')]:t('prov'), [t('xl_item')]:envName(x), [t('xl_plan')]:x.plan, [t('pot')]:potBalance(plan, entries, x.key)}));
    plan.fixed.forEach(f=>Plan.push({[t('xl_type')]:t('fixed'), [t('xl_item')]:nm(f), [t('xl_plan')]:f.amt||0, [t('xl_due')]:f.due||''}));
    plan.jars.forEach(j=>Plan.push({[t('xl_type')]:t('variable'), [t('xl_item')]:nm(j), [t('xl_plan')]:j.plan}));
    Plan.push({[t('xl_type')]:t('corpus'), [t('xl_item')]:t('emerg'), [t('xl_plan')]:corpusEmer()}); Plan.push({[t('xl_type')]:t('corpus'), [t('xl_item')]:'SIP', [t('xl_plan')]:corpusSip()});
    const wb = XLSX.utils.book_new();
    const add = (rows, name) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{'—':''}]), name);
    add(Months, 'Months'); add(Entries, 'Entries'); add(FixedBab, t('xl_sh_fix')); add(MoneyIn, t('xl_sh_in')); add(Plan, t('xl_sh_plan'));
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const type = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const name = `ghar-kharch-${MKEY}.xlsx`;
    const blob = new Blob([out], {type});
    window.__lastExport = {Months, Entries, FixedBab, MoneyIn, Plan};
    try{ const file = new File([blob], name, {type}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Ghar Kharch'}); toast('✓ ' + t('exported')); return; } }
    catch(e){ if(e && e.name==='AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000); toast('✓ ' + t('exported'));
  }catch(e){ toast('⚠ ' + (e && e.message || 'export')); }
  finally{ btn.disabled = false; }
}

  return {amt, to: to.replace(/@.*$/, '')};
}

        else { sw.style.display = 'none'; sg.innerHTML = ''; }
      });
      body.querySelectorAll('[data-m]').forEach(x=>x.onclick = ()=>{ const was = x.classList.contains('on'); body.querySelectorAll('[data-m]').forEach(y=>{ const on = y === x && !was; y.classList.toggle('on', on); y.setAttribute('aria-pressed', on); }); });
      const del = body.querySelector('#yk-del'); if(del) del.onclick = ()=>close('del');
      const a = body.querySelector('#yk-amt'); if(!isEdit && a) setTimeout(()=>{ try{ a.focus(); }catch(e){} }, 120);
    },
    collect: body => {
      const er = body.querySelector('#yk-err'), a = body.querySelector('#yk-amt');
      const amt = numIn(a.value), c = body.querySelector('[data-c].on'), date = body.querySelector('#yk-date').value, m = body.querySelector('[data-m].on');
      if(!(amt > 0)){ er.textContent = yt('needamt'); a.focus(); return null; }
      if(!c){ er.textContent = yt('needcat'); return null; }
      let cat = c.dataset.c;
      if(SUBS[cat]){ const sb2 = body.querySelector('[data-s].on'); if(!sb2){ er.textContent = yt('needsub'); return null; } cat = sb2.dataset.s; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > isoOf(new Date())){ er.textContent = yt('needdate'); return null; }
      return {amt, cat, date, note:body.querySelector('#yk-note').value.trim().slice(0, 200), mode:m ? m.dataset.m : ''};
    } });
}
function toRow(v){
  const today = isoOf(new Date());
  return {month:PFX + v.date.slice(0,7), ts:v.date === today ? Date.now() : new Date(v.date + 'T12:00:00').getTime(), day:+v.date.slice(8,10),
    cat:'yk', cat_id:v.cat + '|' + (v.mode||''), amt:v.amt, who:me || '', note:v.note || ''};
}
async function bigOk(amt){
  if(amt < 500000) return true;
  return !!(await ask({title:yt('bigq').replace('{x}', fmt(amt)), buttons:[{text:yt('yes'), value:1, cls:''}]}));
}
async function addFlow(){
  if(busy) return; busy = true;
  try{
    const v = await form(null); if(!v || v === 'del') return;
    if(!(await bigOk(v.amt))) return;
    LS.set('gl-yk-mode', v.mode || '');
    const row = toRow(v); let ok = false;
    if(sb){ try{ const r = await sb.from('entries').insert(row).select(); if(r && !r.error){ ok = true; const nr = r.data && r.data[0]; if(nr) rows.push(nr); else await load(); } }catch(e){} }
    if(ok){ LS.set('gl-yk-cache', rows); toast(`✓ ${inr(v.amt)} · ${catName(v.cat)} — ${yt('savedto')}`); }
    else { queue.push(Object.assign({lid:'q' + Date.now()}, row)); LS.set('gl-yk-q', queue); toast(yt('offline')); }
    ym = row.month.slice(PFX.length); buzz([10,30,10]); paint();
  } finally { busy = false; }
}
async function editFlow(r){
  if(!r) return;
  if(r.pending){ toast(yt('pendingedit')); return; }
  if(busy) return; busy = true;
  try{
    const v = await form(r); if(!v) return;
    if(v === 'del'){ await delFlow(r); return; }
    if(!(await bigOk(v.amt))) return;
    if(!sb){ toast(yt('needonline')); return; }
    const row = toRow(v); delete row.who;
    if(ymOf(r) === row.month.slice(PFX.length) && +r.day === row.day) row.ts = r.ts;
    let error = null; try{ const u = await sb.from('entries').update(row).eq('id', r.id); error = u && u.error; }catch(e){ error = e; }
    if(error){ toast('⚠ ' + (error.message || yt('needonline'))); return; }
    Object.assign(r, row); LS.set('gl-yk-cache', rows); ym = row.month.slice(PFX.length); paint(); toast('✓ ' + yt('updated'));
  } finally { busy = false; }
}
async function delFlow(r){
  if(!sb){ toast(yt('needonline')); return; }
  let error = null; try{ const d = await sb.from('entries').delete().eq('id', r.id); error = d && d.error; }catch(e){ error = e; }
  if(error){ toast('⚠ ' + (error.message || yt('needonline'))); return; }
  rows = rows.filter(x=>x !== r); LS.set('gl-yk-cache', rows); paint();
  const back = {month:r.month, ts:r.ts, day:r.day, cat:'yk', cat_id:r.cat_id, amt:r.amt, who:r.who || '', note:r.note || ''};
  toast(`${yt('deleted')} · ${inr(+r.amt||0)}`, {action:t('undo'), fn:async ()=>{
    try{ const x = await sb.from('entries').insert(back).select(); if(x && !x.error){ if(x.data && x.data[0]) rows.push(x.data[0]); else await load(); LS.set('gl-yk-cache', rows); paint(); toast(yt('restored')); } }catch(e){} }});
}
async function csv(){
  await load();
  const A = all().filter(r=>!r.pending).slice().sort((a,b)=>((ymOf(a) + pad2(a.day)) < (ymOf(b) + pad2(b.day)) ? -1 : (ymOf(a) + pad2(a.day)) > (ymOf(b) + pad2(b.day)) ? 1 : (a.ts||0) - (b.ts||0)));
  const q = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
  const head = ['Date', 'Month', 'Financial year', 'Category', 'श्रेणी', 'Sub-category', 'उप-श्रेणी', 'Paid to / note', 'Paid by', 'Amount (Rs)', 'Entered by'];
  const lines = [head.map(q).join(',')].concat(A.map(r=>{ const p = parseId(r), m = ymOf(r), par = parentOf(p.cat), c = catOf(par), sc = par !== p.cat ? catOf(p.cat) : null;
    return [m + '-' + pad2(r.day), m, fyLabel(fyOf(m)), c[3], c[2], sc ? sc[3] : '', sc ? sc[2] : '', r.note || '', modeName(p.mode, true), +r.amt || 0, r.who || ''].map(q).join(','); }));
  const name = `yukti-kharch-${MKEY}.csv`, type = 'text/csv;charset=utf-8';
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type});
  window.__ykCsv = lines;
  try{ const file = new File([blob], name, {type:'text/csv'}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Yukti'}); toast('✓ ' + yt('csvdone')); return; } }
  catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000); toast('✓ ' + yt('csvdone'));
}

// hooks: open the screen, repaint with the rest of the app, refresh when the phone comes back
const _go = go;
go = async function(s, fromPop){
  const r = await _go(s, fromPop);
  if(s === 'yk'){ try{ if(localStorage.getItem('gl-yk') !== '0') localStorage.setItem('gl-yk', '1'); }catch(e){} paint(); if(Date.now() - loadedAt > 5000) load(); }
  return r;
};
const _ra = renderAll;
renderAll = function(){
  const r = _ra.apply(this, arguments);
  try{ paint(); if(sb && !loading && ((!loadedAt && (visible() || curScreen === 'yk')) || (curScreen === 'yk' && Date.now() - loadedAt > 20000))) load(); }catch(e){}
  return r;
};
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && sb && (visible() || curScreen === 'yk')) load(); });
window.addEventListener('online', ()=>{ if(queue.length) load(); });
window.__yk = { rows:()=>rows, queue:()=>queue, add:addFlow };
try{ paint(); }catch(e){}
})();
</script>
