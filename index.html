<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghar Kharch</title>
<meta name="theme-color" content="#F4F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ghar">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Yatra+One&family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;600;700;800&family=Rozha+One&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F4F5F1; --card:#FFFFFF; --ink:#17201C; --ink2:#3C4642; --muted:#6B746F; --line:#E3E6E0; --soft:#EEF0EB; --soft2:#E4E7E1;
  --blue:#1F5FA8; --blue-ink:#174A84; --blue-soft:#E7EFF9; --blue-tint:#CFE0F4;
  --orange:#C2611A; --orange-soft:#FBEBDC; --orange-tint:#F4C9A3;
  --green:#1F7A49; --green-soft:#DFF0E5; --green-tint:#B9DEC6;
  --dark:#17201C; --dark2:#243029; --dark-ink:#F4F5F1; --dark-muted:#AEB8B2;
  --shadow:0 1px 2px rgba(23,32,28,.05), 0 10px 30px -18px rgba(23,32,28,.18);
  --shadow-lg:0 2px 6px rgba(23,32,28,.06), 0 24px 48px -24px rgba(23,32,28,.28);
  --r:20px; --r-sm:14px;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121615; --card:#1B211F; --ink:#EEF1EE; --ink2:#C9D0CC; --muted:#99A39E; --line:#2C3431; --soft:#232A27; --soft2:#2B332F;
  --blue:#86B6EE; --blue-ink:#A9CBF4; --blue-soft:#1A2838; --blue-tint:#25405C;
  --orange:#E8A25A; --orange-soft:#3A2A1B; --orange-tint:#5A3E22;
  --green:#7FD1A0; --green-soft:#1C3328; --green-tint:#2B4D3A;
  --dark:#0C0F0E; --dark2:#161B19; --dark-ink:#EEF1EE; --dark-muted:#99A39E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 24px 48px -24px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#121615; --card:#1B211F; --ink:#EEF1EE; --ink2:#C9D0CC; --muted:#99A39E; --line:#2C3431; --soft:#232A27; --soft2:#2B332F;
  --blue:#86B6EE; --blue-ink:#A9CBF4; --blue-soft:#1A2838; --blue-tint:#25405C;
  --orange:#E8A25A; --orange-soft:#3A2A1B; --orange-tint:#5A3E22;
  --green:#7FD1A0; --green-soft:#1C3328; --green-tint:#2B4D3A;
  --dark:#0C0F0E; --dark2:#161B19; --dark-ink:#EEF1EE; --dark-muted:#99A39E;
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans Devanagari',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.num{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;transition:transform .12s var(--ease),background-color .18s,border-color .18s,color .18s}
button:active{transform:scale(.97)}
input,select{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;padding:14px 16px 118px;flex-direction:column;gap:20px}
.screen.on{display:flex}
.screen.enter{animation:rise .32s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bloom{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important} }

/* ---------- header / hero ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 0}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top .sub{color:var(--muted);font-size:14px;margin-top:4px}
.top .lang-mini{min-height:40px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.days{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:38px;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;scroll-snap-align:center;position:relative}
.days button small{font-size:9.5px;font-weight:600;color:var(--muted);line-height:1}
.days button.p{background:var(--soft);box-shadow:none}
.days button.t{background:var(--blue);color:#fff}
.days button.t small{color:rgba(255,255,255,.8)}
.days button.f{opacity:.45}
.days button.has::after,.days button.due::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:3px;background:var(--blue)}
.days button.t.has::after{background:#fff}
.days button.due::after{background:var(--orange)}
.hero{background:linear-gradient(160deg,var(--dark2),var(--dark) 70%);color:var(--dark-ink);border-radius:var(--r);padding:14px 18px 12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(134,182,238,.22),transparent 65%);pointer-events:none}
.hero .l{font-size:13px;color:var(--dark-muted);letter-spacing:.02em}
.hero .top2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .side{text-align:right}
.hero .v2{font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--dark-ink);line-height:1.1}
.hero .v2.neg{color:#F4B183}
.hero .bar3{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;display:flex}
.hero .bar3 b{display:block;height:100%;width:0;transition:width .8s var(--ease)}
.hero .bar3 .s1,.hero .lane i.s1{background:#86B6EE}
.hero .bar3 .s2,.hero .lane i.s2{background:#CFE0F4}
.hero .bar3 .s3,.hero .lane i.s3{background:#E9955A}
.hero .lanes{display:flex;flex-direction:column;gap:3px}
.hero .lane{display:grid;grid-template-columns:8px auto repeat(3,minmax(0,1fr));align-items:center;gap:6px;font-size:13px;color:var(--dark-muted);text-align:left;padding:3px 0;width:100%}
.hero .lane .n{white-space:nowrap}
.hero .lane .a,.hero .lane .b{overflow:hidden;text-overflow:ellipsis}
.hero .lane.hd{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:0 0 1px;opacity:.75}
.hero .lane .a{text-align:right}
.hero .lane i{width:8px;height:8px;border-radius:4px;display:block}
.hero .lane .n{color:var(--dark-ink);font-weight:600}
.hero .lane .a,.hero .lane .b{white-space:nowrap;font-variant-numeric:tabular-nums}
.hero .lane .b{text-align:right}
.hero .lane b{color:var(--dark-ink);font-weight:600}
.hero .lane .b b{color:#F4C9A3}
.hero .lane:active{opacity:.7}
.hero .v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero .v.neg{color:#F4B183}
.hero .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.hero .bar b{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#86B6EE,#CFE0F4);transition:width .8s var(--ease)}
.hero .bar b.w{background:linear-gradient(90deg,#E8A25A,#F4C9A3)}
.hero .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dark-muted)}
.hero .row b{color:var(--dark-ink);font-weight:600}
.hero .row.tap{cursor:pointer;margin:2px -8px 0;padding:8px 8px 4px;border-top:1px solid rgba(255,255,255,.1);border-radius:0;flex-wrap:wrap;row-gap:2px}
.hero .row.tap>span{white-space:nowrap}
.hero .row.tap:active{background:rgba(255,255,255,.08)}
.hero .chev{color:var(--dark-muted);font-size:16px;margin-left:2px}
.hero .daily{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:0;padding-top:7px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:var(--dark-muted)}
.hero .daily .d{font-size:16px;font-weight:700;color:var(--dark-ink);font-variant-numeric:tabular-nums}
.hero .daily .d small{font-size:12px;font-weight:500;color:var(--dark-muted)}

/* ---------- due banner ---------- */
.due{background:var(--orange-soft);border:1px solid var(--orange-tint);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.due .h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--ink)}
.due .h svg{color:var(--orange);animation:ring 1.6s var(--ease) 1}
.due{padding:10px 12px;gap:8px}
.dueline{width:100%;text-align:left}
.dueline .h{display:flex;align-items:center;gap:8px}
.due .h .n{margin-left:auto;background:var(--orange);color:#fff;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.due .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.due .tile{background:var(--card);border-radius:12px;padding:8px 8px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;box-shadow:var(--shadow);min-height:72px;justify-content:center}
.due .tile .nm{font-size:12.5px;font-weight:700;line-height:1.15;word-break:break-word}
.due .tile .amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.due .tile .go{font-size:11px;font-weight:700;color:#fff;background:var(--orange);border-radius:8px;padding:2px 8px;margin-top:2px;white-space:nowrap}
.due .tile.late .go{background:var(--ink)}
.due .it{display:flex;align-items:center;gap:10px;min-height:46px;background:var(--card);border-radius:12px;padding:0 10px 0 12px;width:100%;text-align:left;box-shadow:var(--shadow)}
.due .it .nm{flex:1;font-weight:600}
.due .it .amt{color:var(--muted)}
.due .it .go{min-height:34px;padding:0 12px;border-radius:10px;background:var(--orange);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center}

/* ---------- sections ---------- */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;gap:10px;padding:0 2px}
.sec-h .fch{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .2s}
.sec.fold>*:not(.sec-h):not(.prog){display:none!important}
.sec.fold .fch{transform:rotate(-90deg)}
.due .h.dclose{cursor:pointer;width:100%}
.sec.fold .prog{opacity:.85}
.sec-h.tap{cursor:pointer;min-height:44px;border-radius:12px;transition:background .15s}
.sec-h.tap:active{background:var(--soft)}
#onb{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:22px 18px 40px;display:flex;flex-direction:column;gap:14px}
#onb .ob-st{font-size:13px;color:var(--muted);font-weight:600}
#onb h2{font-size:26px;line-height:1.25;margin:0}
#onb .ob-s{color:var(--ink2);font-size:15px;line-height:1.5}
#onb .card .field:first-child{border-top:0}
#onb .ob-nav{display:flex;gap:10px;margin-top:6px}
#onb .ob-nav .btn{flex:1}
#onb .ob-left{font-weight:700;padding:10px 14px;border-radius:12px;background:var(--soft)}
#onb .ob-left.neg{color:var(--red,#c0392b)}
#onb .ob-err{color:var(--red,#c0392b);font-weight:600;min-height:20px}
#onb .chip.on{background:var(--ink);color:var(--bg)}
#onb .lang{display:flex;gap:10px}#onb .lang button{flex:1;min-height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:700}#onb .lang button.on{background:var(--ink);color:var(--bg)}
html.boot .app,html.boot .tabs{visibility:hidden}
html.boot body::after{content:"…";position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--muted)}
#b-sip.none,#b-emer.none{display:none}
.sec-h .n{width:26px;height:26px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sec-h .t{font-size:18px;font-weight:700;flex:1;letter-spacing:-.01em}
.sec-h .tt{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:none;font-variant-numeric:tabular-nums}
.sec-h .a{color:var(--blue);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center;padding:0 4px}
.prog{display:flex;align-items:center;gap:10px;padding:0 2px 0 36px;font-size:13px;color:var(--muted)}
.prog .tr{flex:1;height:5px;border-radius:3px;background:var(--soft2);overflow:hidden}
.prog .tr b{display:block;height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .7s var(--ease)}
.prog .tr b.w{background:var(--orange)}
.prog .x{flex:none;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.list{padding:2px 14px}

/* babylon */
.bab2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bab2 .bcard.wide{grid-column:1/-1}
.bcard.saved .big.q{color:var(--muted)}
.envs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ecard{padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;position:relative;border:1.5px solid transparent}
.ecard.on{border-color:var(--green-tint);background:linear-gradient(180deg,var(--green-soft),var(--card) 70%)}
.ecard .eh{display:flex;align-items:center;gap:8px}
.ecard .eh .ic{width:30px;height:30px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.ecard .eh b{font-size:14.5px;line-height:1.2;flex:1;min-width:0}
.ecard .bal{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ecard .bal small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.ecard .ln{font-size:11.5px;color:var(--muted);line-height:1.35}
.ecard .mo{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap}
.ecard .mo .box{width:22px;height:22px;border-radius:7px}
.ecard .tg{height:5px;border-radius:3px;background:var(--soft2);overflow:hidden}
.ecard .tg i{display:block;height:100%;background:#7A5C2E;border-radius:3px}
.ecard .tgl{font-size:11px;color:var(--muted)}
.ecard .bal.neg{color:var(--orange)}
.ecard .fixit{font-size:12px;font-weight:700;color:var(--blue);margin-top:2px}
.ecard .mo span{overflow:hidden;text-overflow:ellipsis}
html.elder .ecard .bal{font-size:24px}
.ecard .box{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--card);color:transparent}
.ecard .box.on{background:var(--green);border-color:var(--green);color:#fff}
.bcard{padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;position:relative;overflow:hidden;border:1.5px solid transparent}
.bcard.on{border-color:var(--blue-tint);background:linear-gradient(180deg,var(--blue-soft),var(--card) 60%)}
.bcard .lbl{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.bcard .big{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bcard .sub{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.bcard .sub span{display:flex;justify-content:space-between;gap:6px}
.bcard .st{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:14px;font-weight:700;color:var(--muted)}
.bcard.on .st{color:var(--blue)}
.bcard .tot{border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:auto}
.bcard .ring{display:flex;align-items:center;gap:10px;margin-top:2px}
.bcard .ring svg{width:46px;height:46px;flex:none;transform:rotate(0)}
.bcard .ring .bg{fill:none;stroke:var(--soft2);stroke-width:3.5}
.bcard .ring .fg{fill:none;stroke:var(--blue);stroke-width:3.5;stroke-linecap:round;transition:stroke-dasharray .8s var(--ease)}
.bcard .ring .rt{display:flex;flex-direction:column;line-height:1.2}
.bcard .ring .rt b{font-size:15px}
.bcard .ring .rt small{font-size:11px;color:var(--muted)}
.bcard .ring .rt small.ok{color:var(--green);font-weight:700}
.bcard .flip{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--green-soft);color:var(--green);font-size:13px;font-weight:700;text-align:center}
.prow .nm small.pot{display:block;font-size:11px;color:var(--muted);font-weight:500}
.prow .nm small.pot.neg{color:var(--orange)}
.closecard{background:linear-gradient(160deg,var(--blue-soft),var(--card));border:1.5px solid var(--blue-tint);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.closecard .t{font-size:17px;font-weight:700}
.closecard .li{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.closecard .li b{font-variant-numeric:tabular-nums}
.closecard .bts{display:flex;gap:8px;margin-top:4px}
.closecard .bts .btn{flex:1;min-height:48px;font-size:15px}
.tag.prov{background:#EEE6F7;color:#5B3B8C}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.prov{background:#2E2340;color:#C9B3EA} }
.bcard .tot b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.pcard{padding:6px 14px 8px}
.pcard .ph{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--blue);min-height:36px;letter-spacing:.02em}
.pcard .ph span:last-child{color:var(--muted);font-weight:500}
.prow{display:flex;align-items:center;gap:12px;min-height:50px;width:100%;text-align:left;border-top:1px solid var(--soft)}
.prow .nm{flex:1;font-size:15px;font-weight:500}
.prow.on .nm{color:var(--muted)}
.prow .amt{font-variant-numeric:tabular-nums;font-weight:600}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;background:var(--card);transition:background-color .18s,border-color .18s}
.box svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:opacity .15s,transform .2s var(--ease)}
.box.on{background:var(--blue);border-color:var(--blue)}
.box.on svg{opacity:1;transform:scale(1)}
.box.hot{border-color:var(--orange);background:var(--orange-soft)}
.box.pop{animation:pop .35s var(--ease)}

/* fixed list */
.row44{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--soft);width:100%;text-align:left}
.list .row44:first-child{border-top:none}
.row44 .nm{flex:1;font-size:15.5px;font-weight:500;line-height:1.25}
.row44.on .nm{color:var(--muted)}
.row44 .amt{font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
.row44 .dt{font-size:12px;color:var(--muted);width:78px;text-align:right;line-height:1.2}
.row44 .dt small{font-size:10.5px;font-variant-numeric:tabular-nums;opacity:.85}
.row44 .dt.hot{color:var(--orange);font-weight:700}
.row44 .dt.ok{color:var(--blue)}

/* jars */
.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.jar{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;width:100%}
.jl{display:flex;flex-direction:column;overflow:auto;min-height:0;flex:1 1 auto;margin:0 -4px;padding:0 4px}
.jl .sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.jl .sum div{background:var(--soft);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.jl .sum small{font-size:11px;color:var(--muted);font-weight:600}
.jl .sum b{font-size:16px;font-variant-numeric:tabular-nums}
.jl .r{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--soft);width:100%;text-align:left}
.jl .r .dt{width:56px;flex:none;color:var(--muted);font-size:13px}
.jl .r .nm{flex:1;font-size:14px}
.jl .r .nm small{display:block;color:var(--muted);font-size:12px}
.jl .r .amt{font-weight:700;font-variant-numeric:tabular-nums}
.who-split{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:0 2px 10px}
.who-split b{color:var(--ink);font-variant-numeric:tabular-nums}
.jar .pot{width:76px;height:73px;position:relative;filter:drop-shadow(0 3px 6px rgba(20,30,25,.10));transform-origin:center}
.jar .pot>*{transform:scale(.76);transform-origin:0 0}
.jar .pot .glass{transform:none;clip-path:path('M26 3 H50 V11 C64 15 73 27 73 43 C73 61 61 71 38 71 S3 61 3 43 C3 27 12 15 26 11 Z')}
.jar .glass{position:absolute;inset:0;clip-path:path('M34 4 H66 V14 C84 20 96 36 96 56 C96 80 80 94 50 94 S4 80 4 56 C4 36 16 20 34 14 Z');background:var(--jar-soft,var(--card));overflow:hidden}
.jar .glass::before{content:"";position:absolute;left:10px;top:20px;width:4px;height:38%;border-radius:3px;background:rgba(255,255,255,.45);z-index:2}
.jar .rim{position:absolute;left:23px;right:23px;top:1px;height:10px;border-radius:5px;background:var(--jar-rim,var(--jar,#5B93D6));opacity:.85;transform:none}
.jar .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,var(--jar-light,#5B93D6),var(--jar,var(--blue)));opacity:.85;transition:height .8s var(--ease)}
.jar .fill::after{content:"";position:absolute;left:-10%;right:-10%;top:-5px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.jar .fill.warn{background:linear-gradient(180deg,#E9955A,var(--orange))}
.jar .ic{position:absolute;left:0;right:0;top:27px;text-align:center;font-size:21px;line-height:1;z-index:3;opacity:.92;transform:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.jar .crack{position:absolute;left:35px;top:42px;width:11px;height:26px;transform:none;z-index:3;display:none;clip-path:polygon(40% 0,60% 0,30% 35%,70% 55%,45% 100%,30% 100%,55% 58%,15% 38%);background:rgba(90,40,10,.55)}
.jar.cracked .crack{display:block}
.jar .plus{position:absolute;right:0;top:4px;width:18px;height:18px;border-radius:9px;background:var(--card);color:var(--blue);font-weight:800;font-size:13px;line-height:18px;text-align:center;box-shadow:var(--shadow);z-index:4;display:none;transform:none}
.jar.quiet .plus{display:block}
.jar .nm .tick{color:var(--green);font-size:12px;margin-left:3px}
.jar[data-jar="veg"]{--jar:#4F9A6E;--jar-light:#8CC9A5;--jar-soft:#EAF3EC}
.jar[data-jar="fruit"]{--jar:#E0924A;--jar-light:#F2BC85;--jar-soft:#FAEFE3}
.jar[data-jar="paneer"]{--jar:#CDB04E;--jar-light:#E6D28A;--jar-soft:#F8F3E1}
.jar[data-jar="fun"]{--jar:#8C6BC4;--jar-light:#B9A1DF;--jar-soft:#F0EBF7}
.jar[data-jar="med"]{--jar:#CF6A62;--jar-light:#E8A09A;--jar-soft:#F9EAE8}
.jar[data-jar="stat"]{--jar:#5B80AA;--jar-light:#93B0D1;--jar-soft:#E9EFF6}
.jar[data-jar="deepak"]{--jar:#D9A04A;--jar-light:#EFC98A;--jar-soft:#F9F1E2}
.jar[data-jar="phool"]{--jar:#D77BA3;--jar-light:#EBAFC8;--jar-soft:#F8EAF0}
.jar[data-jar="mandir"]{--jar:#E0834A;--jar-light:#F2B088;--jar-soft:#F9ECE3}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .jar .glass{background:color-mix(in srgb,var(--jar,#5B93D6) 18%,var(--card))} }
.jar .nm{font-size:13px;font-weight:700;line-height:1.15;min-height:18px;display:flex;align-items:flex-start;justify-content:center;word-break:break-word}
.jar .lf{font-size:14px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.jar .dy{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--muted);font-weight:600;white-space:nowrap}
.jar .dy.warn{background:var(--orange-soft);color:var(--orange)}
.jar .eq{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.jar .lf.neg{color:var(--orange)}
.hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.4}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{max-width:520px;margin:0 auto;display:flex;align-items:flex-end;gap:4px}
.tab{flex:1;min-height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;transition:transform .25s var(--ease)}
.tab.on{color:var(--blue);background:var(--blue-soft)}
.tab.on svg{transform:translateY(-1px) scale(1.06)}
.tab.plus{flex:1.15}
.tab.plus .pb{width:62px;height:62px;border-radius:31px;background:linear-gradient(160deg,#3A79C4,var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-30px;box-shadow:0 10px 24px -8px rgba(31,95,168,.6),0 2px 4px rgba(0,0,0,.15);transition:transform .2s var(--ease)}
.tab.plus:active .pb{transform:scale(.94)}
.tab.plus .pb svg{width:30px;height:30px}

/* buttons / chips */
.btn{min-height:54px;border-radius:16px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;box-shadow:0 8px 20px -10px rgba(31,95,168,.6)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.danger{background:var(--orange);box-shadow:none}
.btn.quiet{background:var(--soft);color:var(--ink2);box-shadow:none}
.btn:disabled{opacity:.35;box-shadow:none}
.chip{min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;display:inline-flex;align-items:center;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* log */
.seg{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:14px}
.seg button,.seg label{flex:1;min-height:42px;border-radius:11px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;color:var(--ink2);cursor:pointer}
.seg .on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dsel{font-size:14px;text-align:center;color:var(--muted);font-weight:600;min-height:20px}
.dsel.past{color:var(--orange)}
.dsel:empty{display:none}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cat{min-height:74px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px 7px;text-align:center;border:2px solid transparent}
.cat .nm{font-size:14px;font-weight:700;line-height:1.15}
.cat .lf{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .mb{width:70%;height:3px;border-radius:2px;background:var(--soft2);overflow:hidden}
.cat .mb b{display:block;height:100%;background:var(--blue)}
.cat .mb b.w{background:var(--orange)}
.cat.on{border-color:var(--blue);background:var(--blue-soft)}
.cat.fixc{background:var(--soft);box-shadow:none}
.cat.quick{background:linear-gradient(180deg,var(--card),var(--orange-soft))}
.cat.quick.on{background:var(--blue-soft)}
.cat.fixc.on{background:var(--blue-soft)}
.picked{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border:1.5px solid var(--blue-tint);border-radius:14px;padding:10px 14px;min-height:50px;width:100%;text-align:left}
.picked .nm{flex:1;font-weight:700;color:var(--blue-ink)}
.picked .ch{font-size:13px;font-weight:600;color:var(--blue)}
.amtbox{text-align:center;min-height:64px;display:flex;align-items:baseline;justify-content:center;gap:4px;padding:4px 0}
.amtbox .cur{color:var(--muted);font-size:26px;font-weight:600}
.amtbox .v{font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.amtbox .v.zero{color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad button{min-height:56px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.pad button.op{background:var(--soft);box-shadow:none;font-size:18px;color:var(--ink2)}
.who{display:flex;gap:8px}
.who button{flex:1;min-height:46px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;border:2px solid transparent;color:var(--ink2)}
.who button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.lbl-s{font-size:13px;color:var(--muted);font-weight:600;padding:0 2px}
.notein{min-height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);font-size:16px;width:100%}
.notein:focus{outline:none;border-color:var(--blue)}
.notein::placeholder{color:var(--muted)}
.chips.qa{justify-content:center;min-height:0}
.chips.qa:empty,.chips.nc:empty{display:none}
.chips.qa .chip{min-height:38px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-ink);background:var(--blue-soft);box-shadow:none}
.chips.nc .chip{min-height:36px;font-size:13px;background:var(--soft);box-shadow:none;color:var(--ink2)}
.chips .chip.on{background:var(--ink);color:var(--bg)}
.photo{display:flex;gap:8px;align-items:center}
.photo .pbtn{flex:1;min-height:48px;border-radius:14px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;background:var(--card)}
.photo .pbtn.has{border-style:solid;border-color:var(--blue-tint);background:var(--blue-soft);color:var(--blue-ink)}
.photo .pbtn img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.photo .pclr{display:none;width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--ink2);font-size:16px}
.photo .pclr.on{display:block}
.sr{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
html:has(.sheet-bg.on) .toast{z-index:32;bottom:auto;top:calc(14px + env(safe-area-inset-top))}
#save-set{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 10px 30px -8px rgba(0,0,0,.35)}
html.elder #save-set{bottom:calc(100px + env(safe-area-inset-bottom))}
html:has(.sheet-bg.on),html:has(.sheet-bg.on) body{overflow:hidden;overscroll-behavior:none}
html.tapguard .tabs,html.tapguard .app{pointer-events:none}
.days button{width:44px}
.ecard .mo{min-height:44px}
.jar .plus{width:30px;height:30px;line-height:30px;border-radius:15px;font-size:16px;top:-2px;right:-4px}
.top .lang-mini,.topbtns .lang-mini{min-height:44px!important;min-width:44px}
.jh .js,.js{min-height:44px!important}
.gh{min-height:44px!important}
#fix-toggle{min-height:44px;padding:0 12px}
#sync-now{min-height:44px;padding:0 12px}
.ecard .eh{min-height:44px}
#up-add{min-width:44px}
.fdel{min-width:40px;min-height:44px;flex:none}
#f-fixed .field{gap:6px;padding:0 10px}
#f-fixed .field input.txt{width:0;min-width:0;flex:1}
#f-fixed .field input.sm{width:56px}
#f-fixed .field input:not(.txt):not(.sm){width:84px}
.sec-h .a{min-height:44px}
[data-tell]{min-height:44px;display:inline-flex;align-items:center}
html.elder .jar .dy{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
.toast .ua{white-space:nowrap;margin-left:8px;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;pointer-events:auto}
.toast.act{pointer-events:none}
.pv{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--soft)}
.row44 .pic,.jl .r .pic{width:18px;height:18px;flex:none;color:var(--muted)}

/* month switch */
.msw{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:4px}
.msw button{min-width:52px;min-height:46px;border-radius:10px;font-size:24px;color:var(--blue);font-weight:300}
.msw button:disabled{color:var(--line)}
.msw .m{font-size:17px;font-weight:700;text-align:center;flex:1}
.msw .m small{display:block;font-size:12px;font-weight:500;color:var(--muted)}

/* book */
.kpi2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 4px;position:sticky;top:0;background:var(--bg);z-index:1}
.day-h .t{font-weight:700;font-size:15px}
.tag{font-size:11px;font-weight:700;padding:3px 0;border-radius:8px;width:62px;text-align:center;flex:none;align-self:center;line-height:1.3}
.tag.bab{background:var(--blue-soft);color:var(--blue-ink)}
.tag.fix{background:var(--soft);color:var(--ink2)}
.tag.up{background:var(--orange-soft);color:var(--orange)}
.tag.late{background:var(--soft2);color:var(--muted)}
.tag.var{background:var(--orange-soft);color:var(--orange)}
.tag.in{background:var(--green-soft);color:var(--green)}
/* money in */
.incard{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.incard .h{display:flex;align-items:center;gap:10px}
.incard .h .ic{width:30px;height:30px;border-radius:10px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.incard .h .t{flex:1;font-weight:700;font-size:16px}
.incard .h .tt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);font-size:18px}
.incard .tr{height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.incard .tr b{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .7s var(--ease)}
.incard .x{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.incard .x b{color:var(--ink);font-weight:600}
.inrow{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--soft);width:100%;text-align:left;font-size:14px}
.inrow .dt{width:58px;color:var(--muted);font-size:13px;flex:none}
.inrow .nm{flex:1;color:var(--ink2)}
.inrow .amt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.inadd{min-height:46px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
.sheet .fld{display:flex;flex-direction:column;gap:4px}
.sheet .fld label{font-size:13px;font-weight:600;color:var(--muted);padding-left:2px}
.sheet .flds{display:flex;flex-direction:column;gap:10px}
.sheet input[type=date]{font-size:17px;min-height:50px}

/* snapshot */
.review{display:flex;flex-direction:column;gap:8px;padding:16px}
.week{display:flex;flex-direction:column;gap:8px;padding:16px}
.week:empty{display:none}
.week .hd{display:flex;align-items:center;gap:10px}
.week .hd .t{flex:1;font-weight:700;font-size:16px}
.week .hd .sh{min-height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.week .li{display:flex;justify-content:space-between;gap:8px;font-size:14px;min-height:28px;align-items:center}
.week .li .o{color:var(--orange);font-weight:700}
.review .big{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.review .big .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.review h3{margin:8px 0 0;font-size:14px;font-weight:700}
.review .li{display:flex;justify-content:space-between;font-size:14px;gap:8px;min-height:30px;align-items:center}
.cascade{display:flex;flex-direction:column;gap:12px;padding:16px}
.step{display:flex;flex-direction:column;gap:5px}
.step .l{display:flex;justify-content:space-between;font-size:14px}
.step .bar{display:flex;align-items:center;gap:8px}
.step .tr{flex:1;height:12px;border-radius:6px;background:var(--soft2);overflow:hidden}
.step .tr b{display:block;height:100%;width:0;background:var(--blue);border-radius:6px;transition:width .8s var(--ease)}
.step .tr b.w{background:var(--orange)}
.step .v{width:78px;text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.gap{border-radius:var(--r-sm);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--orange-soft);border:1px solid var(--orange-tint)}
.gap.ok{background:var(--blue-soft);border-color:var(--blue-tint)}
.gap .v{font-size:22px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums}
.gap.ok .v{color:var(--blue)}
.tbl{padding:4px 14px}
.tbl .r{display:flex;min-height:44px;align-items:center;border-top:1px solid var(--soft);font-size:14px}
.tbl .r:first-child{border-top:none}
.tbl .r>span{width:72px;text-align:right;font-variant-numeric:tabular-nums}
.tbl .r>span:first-child{flex:1;text-align:left}
.tbl .r.h{color:var(--muted);font-size:12px;min-height:34px;font-weight:600}

/* settings */
.field{display:flex;align-items:center;gap:10px;min-height:54px;border-top:1px solid var(--soft);padding:0 14px}
.card .field:first-child{border-top:none}
.field label{flex:1;font-size:15px}
.field input{width:112px;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.field input.txt{width:150px;text-align:left;flex:1}
.field input.sm{width:68px}
.lang{display:flex;background:var(--soft);padding:4px;border-radius:14px}
.lang button{flex:1;min-height:46px;font-size:16px;font-weight:600;border-radius:11px;color:var(--ink2)}
.lang button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sync{font-size:12px;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:4px;background:var(--line);display:inline-block}
.sync.on i{background:#3BA66B}

/* report card button + streak chip + gullak + elder mode */
.rcbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--dark);color:var(--dark-ink);font-size:16px;font-weight:700;width:100%;box-shadow:var(--shadow-lg)}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:10px;background:var(--orange-soft);color:var(--orange);white-space:nowrap}
.streak.cold{background:var(--soft);color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;padding:4px 0 2px}
.score svg{width:64px;height:64px;flex:none}
.score .big2{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.score .l{font-size:12.5px;color:var(--muted);line-height:1.35}
.score .l b{color:var(--ink)}
.gk{display:flex;align-items:center;gap:12px;min-height:62px;border-top:1px solid var(--soft);width:100%;text-align:left}
.list .gk:first-child{border-top:none}
.gk .ic{width:40px;height:40px;border-radius:12px;background:var(--orange-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.gk .nm{flex:1;min-width:0}
.gk .nm b{display:block;font-size:15.5px}
.gk .nm small{display:block;font-size:12.5px;color:var(--muted)}
.gk .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.gk .amt small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right}
.gsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gsum div{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.gsum .sp{background:var(--soft)}
.gsum .sv{background:var(--blue-soft)}
.gsum small{font-size:11.5px;color:var(--muted);font-weight:600}
.gsum b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gbts{display:flex;gap:8px}
.gbts .btn{flex:1;min-height:48px;font-size:15px}
.glog{display:flex;flex-direction:column;overflow:auto;min-height:0}
.glog .r{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--soft);font-size:14px}
.glog .r .dt{width:56px;color:var(--muted);font-size:12.5px;flex:none}
.glog .r .nm{flex:1}
.glog .r .amt{font-weight:700;font-variant-numeric:tabular-nums}
.glog .r .amt.in{color:var(--green)}
.lesson{background:var(--blue-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--blue-ink);line-height:1.4}
/* elder mode: bigger everything, 3 tabs */
html.elder{font-size:18px}
html.elder body{font-size:18px}
html.elder .row44 .nm,html.elder .hrow .nm b,html.elder .jar .nm{font-size:18px}
html.elder .row44 .amt,html.elder .hrow .amt,html.elder .jar .lf{font-size:18px}
html.elder .row44{min-height:64px}
html.elder .btn{min-height:60px;font-size:19px}
html.elder .pad button{min-height:66px;font-size:28px}
html.elder .cat{min-height:84px}
html.elder .cat .nm{font-size:16px}
html.elder .tab{min-height:64px;font-size:14px}
html.elder .tab svg{width:30px;height:30px}
html.elder .tab[data-s="book"],html.elder .tab[data-s="snap"],html.elder .tab[data-s="set"]{display:none}
html.elder .tab.mic{display:flex}
html.elder #srch-mini,html.elder #skin-mini{display:none}
html.elder .screen{padding-bottom:150px}
html.elder .tab.plus .pb,html.elder .tab.mic .pb{margin-top:0;width:56px;height:56px}
html.elder .tabs .tab{min-height:64px}
html.elder #s-home .sec:has(#bab-grid),html.elder #s-home .sec:has(#pg-fix),html.elder #close-card,html.elder #in-card,html.elder #gullak-sec,html.elder #env-sec{display:none}
html.elder .hint{font-size:18px}
#elder-help{display:none}
html.elder #elder-help{display:flex}
html.elder #jh-dn,html.elder #jh-lf,html.elder #jh-pd,html.elder #jh-mast,html.elder #he-l,html.elder #bh-t,html.elder #bh-tot span,html.elder .jar .dy,html.elder .sec-h .n,html.elder .fbbtn,html.elder .fbbtn span,html.elder #sync span,html.elder #sync button,html.elder .due .n{font-size:18px!important}
html.elder .sec-h .n{width:30px;height:30px}
html.elder .jar .eq,html.elder #jh-strips,html.elder #jh-in,html.elder #jh-foot,html.elder #he-lanes,html.elder #he-in,html.elder #bh-rows,html.elder #bh-in,html.elder #bh-jama{display:none!important}
html.elder .jar .lf small,html.elder .jar small,html.elder .tile .go,html.elder .due .h,html.elder .sec-h .tt,html.elder .who button,html.elder .days button,html.elder .lbl{font-size:18px!important}
html.elder #up-sec{display:none}
html.elder small,html.elder .hrow small,html.elder .cat .lf,html.elder .prog .x,html.elder .top .sub,html.elder .hero small{font-size:18px!important}
html.elder .tile .go{font-size:15px}
html.elder .hero .v{font-size:40px}
html.elder .sheet .t{font-size:22px}
html.elder .sheet .lst button{min-height:58px;font-size:18px}
html.elder .chip{min-height:46px;font-size:16px}
html.elder .topbtns .lang-mini{width:52px;height:52px}
html.elder #lang-mini{display:none}
html.elder .topbtns .lang-mini svg{width:26px;height:26px}
.tab.mic{display:none}
.tab.mic .pb{background:linear-gradient(160deg,#E9955A,var(--orange));box-shadow:0 10px 24px -8px rgba(194,97,26,.6),0 2px 4px rgba(0,0,0,.15)}

/* helpers (doodh / bai / kude wali) */
.hrow{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--soft);width:100%;text-align:left}
.list .hrow:first-child{border-top:none}
.hrow .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.hrow .nm{flex:1;min-width:0}
.hrow .nm b{display:block;font-size:15.5px}
.hrow .nm small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.hrow .amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.hrow .amt small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cal button{min-height:46px;border-radius:11px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:600;color:var(--ink2);border:2px solid transparent}
.cal button small{font-size:10.5px;font-weight:700;color:var(--blue-ink)}
.cal button.fut{opacity:.4}
.cal button.today{border-color:var(--blue)}
.cal button.off{background:var(--orange-soft);color:var(--orange)}
.cal button.off small{color:var(--orange)}
.cal button.zero{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.cal button.empty{background:none;min-height:0}
.cal button.sel{box-shadow:0 0 0 2.5px var(--blue) inset;background:var(--blue-soft);color:var(--blue-ink)}
.hsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.hsum div{background:var(--soft);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.hsum small{font-size:11px;color:var(--muted);font-weight:600}
.hsum b{font-size:16px;font-variant-numeric:tabular-nums}
.hwrap{overflow:auto;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;gap:10px}
.hwrap>*{flex:none}
.hlegend{font-size:12.5px;color:var(--muted);line-height:1.4}
/* feedback */
.fbbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:700;color:var(--ink2);width:100%}
.fbbox{display:flex;flex-direction:column;gap:10px}
.fbbox textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.fbbox .mrow{display:flex;gap:8px;align-items:center}
.fbbox .mrow button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--blue-soft);color:var(--blue-ink);font-weight:700;display:flex;align-items:center;gap:6px}
.fbbox .mrow button.rec{background:var(--orange-soft);color:var(--orange)}

/* top-right buttons: search · mic · language */
.topbtns{display:flex;gap:8px;align-items:center;flex:none}
.topbtns .lang-mini svg{width:20px;height:20px}
.topbtns{gap:6px}
.topbtns .lang-mini{min-height:38px;padding:0 10px;border-radius:11px}
#h-day{white-space:nowrap}
.topbtns .lang-mini.mic{background:var(--blue);color:#fff;box-shadow:0 8px 20px -10px rgba(31,95,168,.6)}
/* voice sheet */
.vz{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 4px;text-align:center}
.vz .orb{width:96px;height:96px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.vz .orb svg{width:40px;height:40px}
.vz .orb::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--blue);opacity:.35;animation:pulse 1.4s ease-out infinite}
.vz.idle .orb::before{animation:none;opacity:0}
.vz.idle .orb{background:var(--soft);color:var(--muted)}
@keyframes pulse{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.vz .heard{font-size:17px;font-weight:600;min-height:24px;line-height:1.35;padding:0 6px}
.vz .heard.dim{color:var(--muted);font-weight:500}
.vz .tip{font-size:12.5px;color:var(--muted);line-height:1.4}
.vz .alt{width:100%;display:flex;gap:8px}
.vz .alt input{flex:1}
.vl{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.vl .vr{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px;min-height:56px;text-align:left;width:100%;border:2px solid transparent}
.vl .vr.bad{border-color:var(--orange);background:var(--orange-soft)}
.vl .vr .jc{font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;background:var(--card);color:var(--blue-ink);flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl .vr .jc.auto{border:1.5px dashed var(--blue-tint)}
.vl .vr.bad .jc{color:var(--orange);background:var(--card)}
.vl .vr .mid{flex:1;min-width:0}
.vl .vr .mid b{display:block;font-size:15px}
.vl .vr .mid small{display:block;font-size:12px;color:var(--muted)}
.vl .vr .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.vl .vr .x{width:32px;height:32px;border-radius:9px;background:var(--card);color:var(--muted);flex:none;font-size:14px;display:flex;align-items:center;justify-content:center}
.vl .ok{color:var(--green);font-weight:700;font-size:15px;padding:4px 2px}
.vl .warnline{font-size:13px;color:var(--orange);font-weight:600;padding:0 2px}

/* lock (family PIN) */
.lock{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock.on{display:flex}
.lock h2{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
.lock .s{font-size:15px;color:var(--muted)}
.lock .dots{display:flex;gap:16px;min-height:20px;margin:6px 0}
.lock .dots i{width:16px;height:16px;border-radius:8px;border:2px solid var(--line);display:block;transition:background .15s}
.lock .dots i.on{background:var(--blue);border-color:var(--blue)}
.lock .dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lock .pad{width:100%;max-width:300px}
.lock .err{font-size:13px;color:var(--orange);min-height:18px;font-weight:600}
/* search in the day book */
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0 12px;min-height:46px}
.srch input{flex:1;border:0;background:none;font-size:15px;min-height:44px;outline:none;color:var(--ink);min-width:0}
.srch svg{width:18px;height:18px;color:var(--muted);flex:none}
.srch button{color:var(--ink2);font-size:14px;width:32px;height:32px;border-radius:8px;background:var(--soft);display:none;flex:none}
.srch.has button{display:block}
/* today grouped by jar */
.row44 .nm small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.3}
/* festival mode */
.festcard{background:linear-gradient(160deg,var(--orange-soft),var(--card));border:1.5px solid var(--orange-tint);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);width:100%;text-align:left}
.festcard .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.festcard .h b{font-size:16px}
.festcard .h span{font-size:12px;color:var(--muted);white-space:nowrap}
.festcard .tr{height:8px;border-radius:4px;background:var(--soft2);overflow:hidden}
.festcard .tr b{display:block;height:100%;background:linear-gradient(90deg,#E9955A,var(--orange));border-radius:4px;transition:width .8s var(--ease)}
.festcard .x{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cat.fest{background:linear-gradient(180deg,var(--card),var(--orange-soft));border-color:var(--orange-tint)}
.cat.fest.on{background:var(--blue-soft);border-color:var(--blue)}
.jar{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.jar:active .pot{transform:scale(.95)}
.jar .pot{transition:transform .15s var(--ease)}
/* sync footer */
.sync button{margin-left:4px;min-height:32px;padding:0 10px;border-radius:9px;background:var(--soft);color:var(--ink2);font-size:12px;font-weight:600}
.sync button:disabled{opacity:.5}
.field.gfield{margin-top:-6px;padding-top:0}
.gsel{width:100%;min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:14px;color:var(--ink2)}
.field input[type=date]{width:156px;text-align:left;font-variant-numeric:normal}
.lock .pad button{box-shadow:var(--shadow)}

/* toast / sheet / celebrate */
.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,16px);background:var(--dark);color:var(--dark-ink);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:90%;opacity:0;pointer-events:none;z-index:9;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}
.toast.on{animation:up .3s var(--ease) forwards}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:none;align-items:flex-end;justify-content:center;animation:fadein .2s}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:sheetup .3s var(--ease);display:flex;flex-direction:column;gap:12px;max-height:82vh;max-height:82dvh}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;box-shadow:0 -10px 0 10px transparent}
.ee{display:flex;flex-direction:column;gap:12px}
.ee-amt{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 0}
.ee-amt span{font-size:28px;color:var(--muted);font-weight:600}
.ee-amt input{font-size:40px;font-weight:700;text-align:center;width:70%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:4px 0;font-variant-numeric:tabular-nums;color:var(--ink)}
.ee-amt input:focus{outline:none;border-color:var(--blue)}
.ee-l{font-size:13px;font-weight:600;color:var(--muted)}
.ee-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.ee-chips .chip{flex:none}
.ee-chips .chip.on{background:var(--ink);color:var(--bg)}
.ee-row{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--soft)}
.ee-row label{flex:none;width:92px;font-size:15px;color:var(--ink2)}
.ee-row input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);font-size:16px;color:var(--ink)}
.ee-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:2px}
.ee-del{color:var(--red,#c0392b);font-weight:600;min-height:44px;padding:0 4px}
.ee-link{color:var(--blue);font-weight:600;min-height:44px;padding:0 4px}
html.elder .ee-row label{font-size:18px;width:110px}
html.elder .ee-amt input{font-size:48px}
.sheet .t{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sheet .s{font-size:14px;color:var(--muted);margin-top:-6px}
.sheet input{min-height:54px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font-size:22px;background:var(--bg);width:100%;font-variant-numeric:tabular-nums}
.sheet input.txt{font-size:17px}
.sheet input:focus{outline:none;border-color:var(--blue)}
.sheet .bts{display:flex;gap:8px;margin-top:4px;flex:none}
.sheet .bts .ghost{box-shadow:none;background:var(--soft);color:var(--ink)}
.sheet .bts .btn{flex:1}
#sh-body{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.sheet .lst{overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px 4px;display:flex;flex-direction:column;gap:6px;min-height:0;flex:1 1 auto}
.sheet .lst .grp{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:10px 4px 2px}
.sheet .lst button{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 12px;border-radius:12px;background:var(--soft);text-align:left;width:100%}
.sheet .lst button .nm{flex:1;font-weight:600}
.sheet .lst button .amt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.sheet .lst button.done{opacity:.5}
.cel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(244,245,241,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cel{background:rgba(18,22,21,.88)} }
:root[data-theme="dark"] .cel{background:rgba(18,22,21,.88)}
.cel.on{display:flex;animation:fadein .15s}
.cel .c{display:flex;flex-direction:column;align-items:center;gap:10px;animation:bloom .5s var(--ease)}
.cel svg{width:96px;height:96px}
.cel circle{fill:var(--blue)}
.cel path{stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .15s var(--ease) forwards}
.cel .a{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cel .b{font-size:15px;color:var(--muted);font-weight:600}
.cel .w{font-size:15px;color:var(--orange);font-weight:700;background:var(--orange-soft);padding:6px 14px;border-radius:12px;margin-top:4px}
.cel .w:empty{display:none}

/* ---------- Jantri skin (wall-calendar home) ---------- */
html.jantri .hero{background:#FBF7EE;color:#1F1A17;padding:0;gap:0;box-shadow:0 14px 26px -14px rgba(0,0,0,.35),0 2px 0 #D9D0C0;border-radius:6px}
html.jantri .hero::after{display:none}
.jh{display:flex;flex-direction:column}
.jh .perf{height:8px;border-bottom:2px dashed rgba(0,0,0,.16);background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(0,0,0,.08) 18px 22px);background-size:40px 100%;background-position:center top;background-repeat:repeat-x}
.jh .mast{background:#C8102E;color:#FBF7EE;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}

/* Bahi hero */
.bh{display:flex;flex-direction:column}
.bh .cover{padding:12px 16px 10px;display:flex;justify-content:space-between;align-items:flex-end;color:#F6EEDC}
.bh .cover .k{font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.18em;color:#E0B45A}
.bh .cover .t{font-family:'Tiro Devanagari Hindi',serif;font-size:24px;line-height:1.1}
.bh .cover .d{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:#F3D9A0;text-align:right;line-height:1.3}
.bh .page{margin:0 8px;background:#F6EEDC;background-image:repeating-linear-gradient(180deg,transparent 0 35px,rgba(120,80,40,.14) 35px 36px);border-radius:4px 4px 0 0;position:relative;padding:10px 12px 0 30px;color:#1F1A17;box-shadow:inset 0 0 0 1px rgba(120,80,40,.25)}
.bh .page::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1.5px;background:#B3261E;opacity:.7}

.bh .jama .r.g{color:#1C5A36;font-size:15px}
.bh .jama .r b{font-family:'DM Sans',sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.bh .hd{display:grid;grid-template-columns:1fr 78px 78px;font-size:11.5px;color:#6E5A44;padding:6px 0 2px;border-bottom:1px solid rgba(120,80,40,.35)}
.bh .hd span:not(:first-child){text-align:right}
.bh .kr{display:grid;grid-template-columns:1fr 78px 78px;align-items:center;min-height:36px;font-size:16px;width:100%;text-align:left;color:#1F1A17;padding:0}
.bh .kr b{font-family:'DM Sans',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

.bh .kr b.ok{color:#1C5A36}

.bh .tot b.neg{color:#B3261E}
.bh .inb{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:#6E5A44;min-height:34px;cursor:pointer}
.bh .inb b{color:#1F1A17;font-family:'DM Sans',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}

/* brass stamp ritual */
@keyframes stampin{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-18deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(.95) rotate(-9deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-9deg)}}
.stampwrap{position:fixed;z-index:60;pointer-events:none;left:50%;top:40%;width:170px;height:170px;border-radius:85px;border:5px solid #B8862B;color:#B8862B;background:rgba(246,238,220,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;animation:stampin .7s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.stampwrap .a{font-family:'Tiro Devanagari Hindi',serif;font-size:36px;line-height:1}
.stampwrap .b{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em}
/* skin picker */
.skpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skpick button{border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;background:var(--card);text-align:left}
.skpick button.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.skpick .pv{height:64px;border-radius:6px;position:relative;overflow:hidden}
.skpick .pv i{position:absolute;display:block}
.skpick .pv.p1{background:#F4F5F1}.skpick .pv.p1 i:nth-child(1){left:6px;right:6px;top:6px;height:28px;border-radius:6px;background:#243029}.skpick .pv.p1 i:nth-child(2){left:6px;right:6px;top:40px;height:16px;border-radius:4px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.skpick .pv.p2{background:#EDE6D8}.skpick .pv.p2 i:nth-child(1){left:6px;right:6px;top:6px;height:10px;background:#C8102E}.skpick .pv.p2 i:nth-child(2){left:6px;right:6px;top:16px;bottom:6px;background:#FBF7EE}.skpick .pv.p2 i:nth-child(3){left:12px;top:20px;width:18px;height:26px;border-radius:3px;background:#C8102E;opacity:.9}
.skpick .pv.p3{background:#8E1B15}.skpick .pv.p3 i:nth-child(1){left:8px;right:8px;top:14px;bottom:0;background:#F6EEDC;background-image:repeating-linear-gradient(180deg,transparent 0 7px,rgba(120,80,40,.25) 7px 8px)}.skpick .pv.p3 i:nth-child(2){left:16px;top:14px;bottom:0;width:1px;background:#B3261E}.skpick .pv.p3 i:nth-child(3){right:12px;top:24px;width:22px;height:22px;border-radius:11px;border:2px solid #B8862B}
.skpick .nm{font-size:13.5px;font-weight:700;text-align:center}
/* month card (Book) */
.mcard{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mcard .mh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}

.mcard .mh .v.neg{color:var(--orange)}

.mcard .msv-t{font-size:11.5px;font-weight:700;color:var(--green);letter-spacing:.04em;text-transform:uppercase}
.mcard .msv-r{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2)}
.mcard .msv-r b{font-variant-numeric:tabular-nums;color:var(--ink)}
.mcard .msv-r.tot{border-top:1px solid var(--green-tint);padding-top:4px;margin-top:2px;font-weight:700;color:var(--green)}
.mcard .msv-r.tot b{color:var(--green);font-size:16px}
.mcard .mf b.neg{color:var(--orange)}
.mcard .msv-r{gap:10px;align-items:center}

.mcard .msv-r b{flex:none}
.mcard .tellbtn{white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--blue);background:var(--card);border-radius:8px;padding:3px 8px}
.mcard .mh .v2{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.mcard .mh .l2{font-size:12px;color:var(--muted)}
.mcard .mh .side{text-align:right}
.mcard .mr{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;font-size:13.5px;min-height:28px}
.mcard .mr .n{font-weight:700;white-space:nowrap}
.mcard .mr .a{font-variant-numeric:tabular-nums;white-space:nowrap}
.mcard .mr .a small{color:var(--muted)}
.mcard .mr .tl{font-size:12px;white-space:nowrap;min-width:64px;text-align:right}
.mcard .mr .todo{color:var(--orange);font-weight:700}
.mcard .mr .ok{color:var(--green);font-weight:700}
.mcard .mb{height:6px;border-radius:3px;background:var(--soft2);overflow:hidden;min-width:40px}
.mcard .mb i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.mcard .mb i.s1{background:var(--green)}.mcard .mb i.s2{background:var(--orange)}.mcard .mb i.s3{background:var(--blue)}.mcard .mb i.s4{background:#7A5C2E}
.mcard .mj{display:flex;flex-direction:column;gap:2px;padding:6px 0 2px;border-top:1px dashed var(--line);margin-top:2px}
.mcard .mjh{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:2px 0 4px}
.mcard .mr.jr{min-height:26px;font-size:13px;width:100%;text-align:left}
.mcard .mr.jr .n{font-weight:600;color:var(--ink2)}
.mcard .mf{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-top:6px;border-top:1px solid var(--line)}
.mcard .mf b{color:var(--ink);font-variant-numeric:tabular-nums}
@media(max-width:380px){ .mcard .mr{grid-template-columns:auto 1fr auto} .mcard .mr .tl{display:none} }
#amt.pre{color:var(--muted)}
#amt.pre::after{content:' ✎';font-size:.5em;vertical-align:middle}
.fdel{width:34px;min-width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:15px;flex:none}
.fdel:active{background:var(--orange-soft);color:var(--orange)}

/* fixed groups */
.gblks{display:flex;flex-direction:column;gap:10px}
.gblk{display:flex;flex-direction:column;gap:6px}
.gh{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px;width:100%;text-align:left;font-size:14px;color:var(--ink)}

/* where it went */
.where{display:flex;flex-direction:column;gap:8px;padding:14px}
.where .h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px}
.where .h small{color:var(--muted);font-weight:500;font-size:12.5px}
.where .wr{display:grid;grid-template-columns:26px 1fr 72px 44px;align-items:center;gap:8px;font-size:14px}
.where .wr .bar{height:8px;border-radius:4px;background:var(--soft2);overflow:hidden}

/* page tear */
@keyframes tearoff{0%{transform:rotate(0) translateY(0);opacity:1}25%{transform:rotate(-2deg) translateY(4px)}60%{transform:rotate(12deg) translateY(45vh);opacity:1}100%{transform:rotate(26deg) translateY(120vh);opacity:0}}

async function renderClose(){

  const c = viewCache[pk]; if(!c || c.loading){ el.innerHTML=''; return; }
  const P = c.plan, E = c.entries, C = calc(c);
  const sweep = P.jars.reduce((a,j)=>a+Math.max(0, j.plan - E.filter(e=>jarMatch(e,j.id)).reduce((x,e)=>x+e.amt,0)),0);
  const carry = {}; P.provisions.forEach(x=>{ carry[x.key] = potBalance(P, E, x.key); });

  document.getElementById('close-now').onclick = async ()=>{
    const est = Math.max(0, C.received - C.out); const sv = await ask({title:t('savedq').replace('{m}', monthName(pk)), sub:t('savedsub2').replace('{i}', inr(C.received)).replace('{o}', inr(C.out)).replace('{y}', inr(est)), input:{value:est, placeholder:'0'}, okText:t('closenow')}); if(sv===null || sv===undefined) return; const savedAmt = (sv===true) ? est : sv;
    plan.pendingClose = null;

    pastSaved[pk] = savedAmt;
    try{ await sb.from('months').upsert({id:pk, data:Object.assign({}, c.raw||{plan:P, paid:c.paid, inflows:c.inflows, corpus}, {closed, saved:savedAmt}), updated_at:new Date().toISOString()}); }catch(e){}

  };

function longPress(el, fn){

/* ---------- babylon streak + score ---------- */
function babylonDoneNow(){ return !!plan.emergency.done && plan.sips.every(q=>q.done) && (plan.emergency.plan>0 || plan.sips.length>0); }
function streakCount(){
  let n = 0, k = MKEY;
  if(babylonDoneNow()) n = 1;
  k = prevMonthKey();
  // walk backwards month by month while the deposits were made
  for(let i=0;i<60;i++){ const m = pastMonths[k]; if(!m || !m.bab) break; n++; k = shiftMonth(k, -1); }
  // if this month is still pending, the streak counts the past run (don't break it before the month ends)
  return n;
}
function renderStreak(){
  const el = document.getElementById('streak'); if(!el) return;
  const n = streakCount();
  el.className = 'streak' + (n>0 ? '' : ' cold');
  el.textContent = n>0 ? `${t('onfire')} ${n} ${n===1?t('streak1'):t('streakn')}` : t('streak0');
  el.style.display = (n>0 || !babylonDoneNow()) ? '' : 'none';
}
function babylonScore(D){
  const P = D.plan, C = calc(D), live = D.live;
  const day = live ? TODAY : DIM;
  // 40: paid yourself first
  const babParts = [P.emergency.plan>0 ? (P.emergency.done?1:0) : null].concat(P.sips.map(q=>q.plan>0 ? (q.done?1:0) : null)).filter(x=>x!==null);
  let pay = babParts.length ? babParts.reduce((a,b)=>a+b,0)/babParts.length : 0;
  { const bp = (P.emergency.plan||0) + P.sips.reduce((a,q)=>a+(q.plan||0),0); if(bp>0) pay = Math.max(pay, Math.min(1, (C.babActual||0)/bp)); }
  // 30: fixed bills paid by their due date (only those due so far)
  const due = P.fixed.filter(f=>f.due>0 && f.due<=day);
  const onTime = due.filter(f=>{ const p = D.paid[f.id]; return p && (p.day||31) <= f.due; }).length;
  const bills = due.length ? onTime/due.length : 1;
  // 30: jars within their prorated plan
  const jars = C.jars.filter(j=>j.plan>0);
  const within = jars.filter(j=>j.actual <= j.plan * (live ? Math.max(day,1)/DIM : 1) * 1.05).length;
  const jr = jars.length ? within/jars.length : 1;
  return {score: Math.round(pay*40 + bills*30 + jr*30), pay:Math.round(pay*40), bills:Math.round(bills*30), jars:Math.round(jr*30)};
}
function renderScore(D){
  const el = document.getElementById('score-card'); const S = babylonScore(D);
  const r = 26, c = 2*Math.PI*r, off = c*(1-S.score/100), col = S.score>=80 ? 'var(--green)' : S.score>=50 ? 'var(--blue)' : 'var(--orange)';
  el.innerHTML = `<div class="score"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--soft2)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${S.score}</text></svg>
    <div><div class="big2">${t('babscore')}</div><div class="l">${t('babshort')} <b>${S.pay}</b>/40 · ${t('fixed')} <b>${S.bills}</b>/30 · ${t('variable')} <b>${S.jars}</b>/30<br>${t('scorehint')}</div></div></div>`;
}

/* ---------- household helpers: milk days, leaves ---------- */
const hAmt = h => { const f = plan.fixed.find(x=>x.id===h.fixedId); return +((f && f.amt) ?? h.amt ?? 0) || 0; };
function helperCalc(h){
  const L = hlog[h.id] || {};
  if(h.mode==='daily'){
    let q = 0, days = 0; for(let d=1; d<=TODAY; d++){ const v = L[d]!=null ? +L[d] : (+h.qty||0); if(v>0){ q += v; days++; } }
    let full = q; for(let d=TODAY+1; d<=DIM; d++){ const v = L[d]!=null ? +L[d] : (+h.qty||0); if(v>0) full += v; }
    return {qty:q, days, amt:Math.round(q*(+h.rate||0)), full:Math.round(full*(+h.rate||0))};
  }
  const leaves = Object.keys(L).filter(d=>L[d]==='L').length;
  const cut = h.deduct ? Math.round(leaves * hAmt(h) / DIM) : 0;
  return {leaves, cut, amt:Math.max(0, hAmt(h) - cut), full:hAmt(h)};

function shrinkImage(file){
  return new Promise((res, rej)=>{
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = ()=>{ const M = 1280; let w = img.width, h = img.height; const sc = Math.min(1, M/Math.max(w,h)); w = Math.round(w*sc); h = Math.round(h*sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b=>{ URL.revokeObjectURL(u); b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', 0.78); };
    img.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error('img')); };
    img.src = u;
  });
}

function calc(D){
  const P = D.plan, E = D.entries;
  const sum = arr => arr.reduce((a,x)=>a+x.amt,0);
  const prov = P.provisions.reduce((a,p)=>a+p.plan,0);
  const sips = P.sips.reduce((a,s)=>a+s.plan,0);
  const babPlan = P.emergency.plan + sips;
  const babTick = (P.emergency.done?P.emergency.plan:0) + sipTicked(P);
  const babActual = babTick + sum(E.filter(e=>e.cat==='bab' && !provKeyOf(e.catId, P)));
  const envPlan = prov, envActual = provPaid(P) + sum(E.filter(e=>e.cat==='bab' && provKeyOf(e.catId, P)));
  const fixPlan = P.fixed.reduce((a,f)=>a+(P===plan ? planAmt(f) : (f.amt||0)),0);
  const fixActual = Object.values(D.paid).reduce((a,p)=>a+(p.amt||0),0) + sum(E.filter(e=>e.cat==='fix'));
  const jars = P.jars.map(j=>({name:nm(j), plan:j.plan, actual:sum(E.filter(e=>jarMatch(e,j.id)))}));
  const fixItems = P.fixed.map(f=>({name:nm(f), plan:f.amt||0, actual:(D.paid[f.id]?D.paid[f.id].amt:0) + sum(E.filter(e=>e.cat==='fix'&&e.catId===f.id))}));
  const otherFix = sum(E.filter(e=>e.cat==='fix'&&(e.catId==='fix'||!P.fixed.find(f=>f.id===e.catId))));
  const totalPlan = babPlan + envPlan + fixPlan + jars.reduce((a,j)=>a+j.plan,0);
  const out = babActual + envActual + fixActual + jars.reduce((a,j)=>a+j.actual,0);
  const received = (D.inflows||[]).reduce((a,x)=>a+(x.amt||0),0);
  const potsUsed = sum(E.filter(e=>e.cat==='prov'));
  return {income:P.income, babPlan, babActual, envPlan, envActual, fixPlan, fixActual, jars, fixItems, otherFix, totalPlan, out, received, potsUsed};
}

function monthSaving(D, C){
  C = C || calc(D);
  const inv = C.babActual;
  const told = D.live ? null : (pastSaved[D.key]!=null ? +pastSaved[D.key] : (D.closed && D.closed.saved!=null ? +D.closed.saved : null));
  let left = null, kind = 'unknown';
  if(told!=null){ left = told; kind = 'told'; }

}

function weekData(){
  const startDay = Math.max(1, TODAY-6);
  const from = new Date(now.getFullYear(), now.getMonth(), startDay);
  const inWeek = d => d >= startDay && d <= TODAY;
  const rows = entries.filter(e=>inWeek(e.day));
  const spentVar = rows.filter(e=>e.cat==='var').reduce((a,e)=>a+e.amt,0);
  const spentFix = rows.filter(e=>e.cat==='fix').reduce((a,e)=>a+e.amt,0) + Object.values(paid).filter(p=>inWeek(p.day)).reduce((a,p)=>a+(p.amt||0),0);
  const perJar = plan.jars.map(j=>({name:nm(j), wk: rows.filter(e=>jarMatch(e,j.id)).reduce((a,e)=>a+e.amt,0), over: jarSpent(j.id)-j.plan, left:j.plan-jarSpent(j.id)})).sort((a,b)=>b.wk-a.wk);
  const dueSoon = plan.fixed.filter(f=>!paid[f.id] && f.due>0 && f.due>TODAY && f.due<=TODAY+7);
  const overdue = plan.fixed.filter(f=>!paid[f.id] && f.due>0 && f.due<=TODAY);
  return {from, spentVar, spentFix, perJar, dueSoon, overdue, n: rows.length};
}

  const overs = spendLines.filter(l=>l.ac>l.pl).sort((a,b)=>(b.ac-b.pl)-(a.ac-a.pl)).slice(0,3);
  const unders = spendLines.filter(l=>l.ac<l.pl && l.ac>0).sort((a,b)=>(b.pl-b.ac)-(a.pl-a.ac)).slice(0,3);
  const fixOver = C.fixItems.filter(x=>x.actual>x.plan && x.plan>0).sort((a,b)=>(b.actual-b.plan)-(a.actual-a.plan)).slice(0,3);
  const MSr = monthSaving(D, C); const sr = MSr.pct;
  rv.innerHTML = `<div class="sec-h" style="padding:0"><div class="t">${t('review')} · ${monthName(D.key)}</div></div>
    <div class="big"><span>${t('spent')}</span><span class="v">${inr(C.out)}</span></div>
    <div class="big"><span>${D.live ? t('savedproj') : t('savedmonth')}</span><span class="v" style="color:var(--green)">${inr(MSr.total)}${MSr.known?'':' + ?'}</span></div>
    <div class="li"><span>${t('babshort')} + ${t('monthsaving')} (${t('sk_'+MSr.kind)})</span><span class="num">${inr(MSr.inv)} + ${MSr.known ? inr(MSr.left) : '?'}</span></div>
    ${MSr.known ? `<div class="li"><span>${t('savrate')}</span><span class="num">${sr}%</span></div>` : ''}
    <div class="li"><span>${t('received')}</span><span class="num" style="color:var(--green)">${inr(C.received)}</span></div>
    ${C.received>0 ? `<div class="li"><span>${t('inhand')}</span><span class="num" style="color:${C.received-C.out<0?'var(--orange)':'var(--ink)'}">${inr(C.received-C.out)}</span></div>` : ''}
    ${C.potsUsed ? `<div class="li"><span>${t('potwithdraw')}</span><span class="num">${inr(C.potsUsed)}</span></div>` : ''}
    ${whoHtml(D)}
    <h3 style="color:var(--orange)">${t('over')}</h3>
    ${overs.length ? overs.map(l=>`<div class="li"><span>${l.n}</span><span class="num" style="color:var(--orange)">+${fmt(l.ac-l.pl)}</span></div>`).join('') : `<div class="li"><span class="hint">${t('nothingover')}</span></div>`}
    ${fixOver.map(x=>`<div class="li"><span>· ${x.name}</span><span class="num" style="color:var(--orange)">+${fmt(x.actual-x.plan)}</span></div>`).join('')}
    ${C.otherFix ? `<div class="li"><span>· ${t('other')}</span><span class="num">${fmt(C.otherFix)}</span></div>` : ''}
    <h3 style="color:var(--blue)">${t('under')}</h3>
    ${unders.length ? unders.map(l=>`<div class="li"><span>${l.n}</span><span class="num" style="color:var(--blue)">−${fmt(l.pl-l.ac)}</span></div>`).join('') : `<div class="li"><span class="hint">—</span></div>`}`;
  const steps = [[t('inc'),0,inc],[t('emer'),e,inc-e],[t('sip'),s,inc-e-s],[t('prov'),p,inc-e-s-p],[t('fixed'),f,inc-e-s-p-f]];
  document.getElementById('cascade').innerHTML = steps.map(([n,m,l],i)=>`<div class="step"><div class="l"><span>${n}</span><span class="num" style="color:var(--muted)">${m?'−'+fmt(m):''}</span></div><div class="bar"><div class="tr"><b data-k="cas-${i}" data-w="${Math.max(0,l/inc*100)}" class="${i===4?'w':''}"></b></div><span class="v">${fmt(l)}</span></div></div>`).join('')
    + `<div class="hint" style="text-align:left">${t('room')}: <b class="num" style="color:var(--ink)">${inr(inc-e-s-p-f)}</b></div>`;
  const room = inc-e-s-p-f, need = P.jars.reduce((a,j)=>a+j.plan,0), g = room-need;
  const gb = document.getElementById('gapbox'); gb.className = 'gap' + (g<0?'':' ok');
  gb.innerHTML = `<div><div style="font-weight:700">${t('gapt')}</div><div class="hint" style="text-align:left">${t('room')} ${inr(room)} · ${t('plan')} ${inr(need)}</div></div><div class="v">${g<0?'−':'+'}₹${fmt(g)}</div>`;
  const gapc = (pl,ac) => { const d = pl-ac; return `<span class="num" style="color:${d<0?'var(--orange)':'var(--muted)'}">${d<0?'−':'+'}${fmt(d)}</span>`; };
  document.getElementById('pva').innerHTML = `<div class="r h"><span>${t('category')}</span><span>${t('plan')}</span><span>${t('actual')}</span><span>${t('gap')}</span></div>` + lines.map(l=>`<div class="r"><span>${l.n}</span><span class="num">${fmt(l.pl)}</span><span class="num">${fmt(l.ac)}</span>${gapc(l.pl,l.ac)}</div>`).join('')
    + `<div class="r" style="font-weight:700"><span>${t('sumtotal')}</span><span class="num">${fmt(C.totalPlan)}</span><span class="num">${fmt(C.out)}</span>${gapc(C.totalPlan, C.out)}</div>`;
  animBars(document.getElementById('s-snap'));
}

  document.getElementById('f-help').innerHTML = (plan.helpers||[]).map((h,i)=>`<div class="field"><input class="txt" id="in-hn${i}" value="${nm(h).replace(/"/g,'&quot;')}" aria-label="${t('name')}"></div>`
    + (h.mode==='daily' ? fld(t('rate'),'in-hr'+i,h.rate||0) + `<div class="field"><label for="in-hq${i}">${t('dailyqty')}</label><input id="in-hq${i}" inputmode="decimal" value="${h.qty||0}"></div>` : '')).join('');
  const f = plan.festival || {};
