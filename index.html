<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghar Ledger</title>
<meta name="theme-color" content="#1B1F1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghar">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F3EF; --card:#FFFFFF; --ink:#1B1F1D; --muted:#55605B; --line:#DCDFDA; --soft:#ECEEEA;
  --blue:#1F5FA8; --blue-soft:#EAF1FA; --orange:#C86A1A; --orange-soft:#FBEBDC; --dark:#1B1F1D; --dark-ink:#F2F3EF; --dark-muted:#C9CFCB;
  --good:#1F5FA8; --warn:#C86A1A;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141817; --card:#1E2422; --ink:#EEF1EE; --muted:#A9B4AF; --line:#2E3634; --soft:#262D2A;
  --blue:#7FB0EA; --blue-soft:#1C2A3A; --orange:#E39A4F; --orange-soft:#3A2A1B; --dark:#0E1211; --dark-ink:#EEF1EE; --dark-muted:#A9B4AF;
  --good:#7FB0EA; --warn:#E39A4F;
}}
:root[data-theme="dark"]{
  --bg:#141817; --card:#1E2422; --ink:#EEF1EE; --muted:#A9B4AF; --line:#2E3634; --soft:#262D2A;
  --blue:#7FB0EA; --blue-soft:#1C2A3A; --orange:#E39A4F; --orange-soft:#3A2A1B; --dark:#0E1211; --dark-ink:#EEF1EE; --dark-muted:#A9B4AF;
  --good:#7FB0EA; --warn:#E39A4F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Devanagari','DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;padding:18px 16px 110px;flex-direction:column;gap:18px}
.screen.on{display:flex}
.hdr{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.hdr h1{margin:0;font-size:26px;font-weight:700}
.hdr .sub{color:var(--muted);font-size:15px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;gap:10px}
.sec-h .n{width:26px;height:26px;border-radius:13px;background:var(--dark);color:var(--dark-ink);font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.sec-h .t{font-size:18px;font-weight:700;flex:1}
.sec-h .tt{font-size:20px;font-weight:500;flex:none}
.sub2{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:-6px;padding-left:36px;min-height:20px}
.sub2 .a{color:var(--blue);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center}
.sec-h .a{color:var(--blue);font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center;padding:0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bab{padding:12px 10px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.bab .lbl{font-size:14px;font-weight:700;color:var(--blue)}
.bab .big{font-size:18px}
.bab .row{display:flex;justify-content:space-between;font-size:13px;gap:4px}
.bab .prow{display:flex;align-items:center;gap:4px;font-size:12px;min-height:30px;width:100%;text-align:left;border-radius:6px}
.bab .prow .pb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);flex:none;font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}
.bab .prow.on .pb{background:var(--blue);border-color:var(--blue)}
.bab .prow .pn{flex:1;line-height:1.15}
.bab .tot{border-top:1px solid var(--line);padding-top:6px;font-size:12px;color:var(--muted);margin-top:auto}
.tick{min-height:44px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--blue)}
.tick.off{color:var(--muted);font-weight:400}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;color:#fff}
.box.on{background:var(--blue);border-color:var(--blue)}
.box.hot{border-color:var(--orange)}
.list{padding:0 14px}
.row44{display:flex;align-items:center;gap:10px;min-height:54px;border-bottom:1px solid var(--soft);width:100%;text-align:left}
.row44:last-child{border-bottom:none}
.row44 .nm{flex:1;font-size:16px}
.row44 .amt{font-size:16px}
.row44 .dt{font-size:13px;color:var(--muted);width:84px;text-align:right}
.row44 .dt.hot{color:var(--warn);font-weight:700}
.jars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.jar{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.jar .glass{width:100%;height:96px;border-radius:10px 10px 14px 14px;border:2px solid var(--ink);position:relative;overflow:hidden;background:var(--card)}
.jar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--blue)}
.jar .fill.warn{background:var(--orange)}
.jar .nm{font-size:13px;font-weight:700;line-height:1.2;min-height:32px}
.jar .lf{font-size:14px}
.jar .dy{font-size:12px;color:var(--muted)}
.jar .dy.warn{color:var(--warn);font-weight:700}
.hint{font-size:13px;color:var(--muted);text-align:center}
.banner{background:var(--dark);color:var(--dark-ink);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.banner .t{font-size:16px;font-weight:700}
.banner .s{font-size:14px;color:var(--dark-muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs .in{max-width:520px;margin:0 auto;display:flex;align-items:flex-end;gap:4px}
.tab{flex:1;min-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--blue);font-weight:700;background:var(--blue-soft)}
.tab.plus{flex:1.2}
.tab.plus .pb{width:60px;height:60px;border-radius:30px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tab.plus .pb svg{width:30px;height:30px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center}
.chip.on{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:52px;border-radius:14px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 18px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--orange)}
.btn:disabled{opacity:.4}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{min-height:76px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center}
.cat .nm{font-size:15px;font-weight:700;line-height:1.2}
.cat .lf{font-size:12px;color:var(--muted)}
.cat.on{border-color:var(--blue);background:var(--blue-soft)}
.amtbox{text-align:center;font-size:44px;min-height:60px}
.amtbox .cur{color:var(--muted);font-size:28px;margin-right:4px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad button{min-height:58px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:24px}
.pad button.op{background:var(--soft);font-size:18px}
.who{display:flex;gap:8px}
.dates{display:flex;gap:8px}
.dates button,.dates label{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;cursor:pointer}
.dates .on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.dates input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dsel{font-size:15px;text-align:center;color:var(--ink);font-weight:600}
.dsel.past{color:var(--orange)}
.msw{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.msw button{min-width:52px;min-height:48px;border-radius:10px;font-size:22px;color:var(--blue)}
.msw button:disabled{color:var(--line)}
.msw .m{font-size:18px;font-weight:700;text-align:center;flex:1}
.msw .m small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px}
.review .big{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.review .big .v{font-size:24px}
.review h3{margin:6px 0 0;font-size:15px}
.review .li{display:flex;justify-content:space-between;font-size:14px;gap:8px;min-height:28px;align-items:center}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.items button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:14px;font-weight:600;text-align:left;padding:6px 10px;display:flex;flex-direction:column;justify-content:center}
.items button small{font-weight:400;color:var(--muted);font-size:12px}
.items button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.items .grp{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:4px}
.who button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:600}
.who button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.day-h .t{font-weight:700;font-size:16px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;width:64px;text-align:center;flex:none;align-self:center;line-height:1.4}
.tag.bab{background:var(--blue-soft);color:var(--blue)}
.tag.fix{background:var(--soft);color:var(--ink)}
.tag.var{background:var(--orange-soft);color:var(--orange)}
.step{display:flex;flex-direction:column;gap:4px}
.step .l{display:flex;justify-content:space-between;font-size:14px}
.step .bar{display:flex;align-items:center;gap:8px}
.step .tr{flex:1;height:14px;border-radius:5px;background:var(--soft);overflow:hidden}
.step .fl{height:14px;background:var(--blue)}
.step .fl.w{background:var(--orange)}
.step .v{width:74px;text-align:right;font-size:15px}
.gap{border:2px solid var(--orange);background:var(--orange-soft);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gap .v{font-size:22px;color:var(--orange)}
.tbl .r{display:flex;min-height:44px;align-items:center;border-bottom:1px solid var(--soft);font-size:14px}
.tbl .r:last-child{border-bottom:none}
.tbl .r>span{width:72px;text-align:right}
.tbl .r>span:first-child{flex:1;text-align:left}
.tbl .r.h{color:var(--muted);font-size:12px;min-height:32px}
.field{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--soft)}
.field:last-child{border-bottom:none}
.field label{flex:1;font-size:15px}
.field input{width:110px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);text-align:right;font-family:'DM Mono',monospace;font-size:16px}
.field input.txt{width:150px;text-align:left;font-family:inherit}
.field input.sm{width:72px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:12px 18px;border-radius:14px;font-size:15px;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.sync{font-size:12px;color:var(--muted);text-align:center}
.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lang button{flex:1;min-height:48px;font-size:16px}
.lang button.on{background:var(--dark);color:var(--dark-ink)}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section class="screen on" id="s-home">
  <div class="hdr"><h1 id="h-month"></h1><div class="sub" id="h-day"></div></div>
  <div id="due-banner"></div>

  <div class="sec">
    <div class="sec-h"><div class="n">1</div><div class="t" data-i="babylon"></div><div class="tt num" id="tt-bab"></div></div>
    <div class="sub2" id="st-bab"></div>
    <div class="grid3" id="bab-grid"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><div class="n">2</div><div class="t" data-i="fixed"></div><div class="tt num" id="tt-fix"></div></div>
    <div class="sub2"><span id="st-fix"></span><button class="a" id="fix-toggle"></button></div>
    <div class="card list" id="fix-list"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><div class="n">3</div><div class="t" id="var-title"></div><div class="tt num" id="tt-var"></div></div>
    <div class="sub2" id="st-var"></div>
    <div class="jars" id="jars"></div>
    <div class="hint" data-i="jarhint"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><div class="t" data-i="today"></div></div>
    <div class="card list" id="today-list"></div>
  </div>
  <div class="sync" id="sync"></div>
</section>

<!-- LOG -->
<section class="screen" id="s-log">
  <div class="hdr"><h1 data-i="logtitle"></h1><div class="sub" data-i="logsub"></div></div>
  <div class="sec">
    <div class="hint" style="text-align:left" data-i="when"></div>
    <div class="dates" id="dates"></div>
    <div class="dsel" id="dsel"></div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="sec" id="items-wrap" style="display:none">
    <div class="hint" style="text-align:left" data-i="whichitem"></div>
    <div class="items" id="items"></div>
  </div>
  <div class="amtbox"><span class="cur">₹</span><span class="num" id="amt">0</span></div>
  <div class="pad" id="pad"></div>
  <div class="sec">
    <div class="hint" data-i="who"></div>
    <div class="who" id="who"></div>
  </div>
  <button class="btn" id="save" disabled data-i="save"></button>
</section>

<!-- DAY BOOK -->
<section class="screen" id="s-book">
  <div class="hdr"><h1 data-i="book"></h1></div>
  <div class="msw" id="msw-book"></div>
  <div class="sub hint" id="book-sub"></div>
  <div class="grid3" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div class="card"><div class="hint" style="text-align:left" data-i="outsofar"></div><div class="num" style="font-size:22px" id="b-out"></div></div>
    <div class="card"><div class="hint" style="text-align:left" data-i="leftof"></div><div class="num" style="font-size:22px" id="b-left"></div></div>
  </div>
  <div class="chips" id="book-filter"></div>
  <div id="book"></div>
  <div class="hint" data-i="tapundo"></div>
</section>

<!-- SNAPSHOT -->
<section class="screen" id="s-snap">
  <div class="hdr"><h1 data-i="snap"></h1></div>
  <div class="msw" id="msw-snap"></div>
  <div class="sub hint" id="snap-sub"></div>
  <div class="card review" id="review"></div>
  <div class="card" id="cascade" style="display:flex;flex-direction:column;gap:12px"></div>
  <div class="gap" id="gapbox"></div>
  <div class="sec">
    <div class="sec-h"><div class="t" data-i="planactual"></div></div>
    <div class="card tbl" id="pva"></div>
  </div>
</section>

<!-- SETTINGS -->
<section class="screen" id="s-set">
  <div class="hdr"><h1 data-i="settings"></h1></div>
  <div class="sec"><div class="sec-h"><div class="t" data-i="language"></div></div>
    <div class="lang"><button id="l-hi">हिन्दी</button><button id="l-en">English</button></div></div>
  <div class="sec"><div class="sec-h"><div class="t" data-i="iam"></div></div><div class="who" id="who2"></div></div>
  <div class="sec"><div class="sec-h"><div class="t" data-i="income"></div></div><div class="card" id="f-income"></div></div>
  <div class="sec"><div class="sec-h"><div class="t" data-i="babylon"></div></div><div class="card" id="f-bab"></div></div>
  <div class="sec"><div class="sec-h"><div class="t" data-i="corpus"></div></div><div class="card" id="f-corpus"></div></div>
  <div class="sec"><div class="sec-h"><div class="t" data-i="fixed"></div></div><div class="card" id="f-fixed"></div><button class="btn ghost" id="add-fixed" data-i="addfixed"></button></div>
  <div class="sec"><div class="sec-h"><div class="t" data-i="jarsplan"></div></div><div class="card" id="f-jars"></div></div>
  <button class="btn" id="save-set" data-i="saveset"></button>
</section>

</div>

<nav class="tabs"><div class="in">
  <button class="tab on" data-s="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i="t-home"></span></button>
  <button class="tab" data-s="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h12"/></svg><span data-i="t-book"></span></button>
  <button class="tab plus" data-s="log" aria-label="Add"><div class="pb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div><span data-i="t-log"></span></button>
  <button class="tab" data-s="snap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i="t-snap"></span></button>
  <button class="tab" data-s="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i="t-set"></span></button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- i18n ---------- */

// upgrade an older saved plan to the notebook plan, keeping everything the family already logged
function migrate(){
  const v = plan.planVersion||1;
  if(v >= PLAN_VERSION) return false;
  if(v === 2){ const m = plan.fixed.find(f=>f.id==='milk'); if(m && m.amt===2000) m.amt = 2500; plan.planVersion = 3; return true; }
  const old = plan, np = defaultPlan();
  np.members = old.members || np.members;
  if(MKEY==='2026-10'){ octTicks(np);
    const keep = {}; Object.entries(paid||{}).forEach(([id,v])=>{ if(np.fixed.find(f=>f.id===id)) keep[id]=v; });
    paid = Object.assign(keep, OCT_PAID);
  } else {
    np.emergency.done = !!(old.emergency&&old.emergency.done);
    Object.keys(paid||{}).forEach(id=>{ if(!np.fixed.find(f=>f.id===id)) delete paid[id]; });
  }
  plan = np; return true;
}

function prevMonthKey(){ const d = new Date(now.getFullYear(), now.getMonth()-1, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

async function pullMonth(){
  const {data, error} = await sb.from('months').select('data').eq('id', MKEY).maybeSingle();
  if(error) throw error;
  if(data){ const d = data.data; plan = d.plan || plan; corpus = d.corpus || corpus; paid = d.paid || {};
    if(migrate()) await sb.from('months').upsert({id:MKEY, data:{plan, corpus, paid}, updated_at:new Date().toISOString()});
    return; }
  // new month: carry last month's plan + corpus forward, reset ticks
  const prev = await sb.from('months').select('data').eq('id', prevMonthKey()).maybeSingle();
  if(prev.data){ const d = prev.data.data; plan = d.plan || plan; corpus = d.corpus || corpus;
    plan.emergency.done=false; plan.sips.forEach(s=>s.done=false); plan.provDone=false; plan.provisions.forEach(x=>x.done=false); migrate(); }
  paid = {};
  await sb.from('months').upsert({id:MKEY, data:{plan, corpus, paid}});
}
async function pullEntries(){
  const {data, error} = await sb.from('entries').select('*').eq('month', MKEY).order('ts');
  if(error) throw error;
  entries = data.map(fromRow);
}

async function addEntry(e){
  if(sb){
    const {error} = await sb.from('entries').insert({month:e.month||MKEY, ts:e.ts, day:e.day, cat:e.cat, cat_id:e.catId, amt:e.amt, who:e.by, note:e.note||''});

    toast('⚠ ' + error.message);
  }
  if((e.month||MKEY)===MKEY){ entries.push(Object.assign({id:'l'+Date.now()}, e)); localSave(); renderAll(); }

async function delEntry(id){
  if(sb && !String(id).startsWith('l')){
    const {error} = await sb.from('entries').delete().eq('id', id);

/* ---------- items (fixed + babylon) for the picker ---------- */
function itemList(){
  const L = [];
  const gb = t('babylon').split(' ')[0], gf = t('fixed');
  L.push({key:'emergency', cat:'bab', grp:gb, label:t('emer'), amt:plan.emergency.plan});
  plan.sips.forEach((s,i)=>L.push({key:'sip'+i, cat:'bab', grp:gb, label:'SIP · '+s.name, amt:s.plan}));
  plan.provisions.forEach((x,i)=>L.push({key:'prov'+i, cat:'bab', grp:gb, label:t(x.key), amt:x.plan}));
  plan.fixed.forEach(f=>L.push({key:f.id, cat:'fix', grp:gf, label:nm(f), amt:f.amt||0}));
  L.push({key:'other', cat:'fix', grp:gf, label:t('other'), amt:0});
  return L;
}
// current month: logging a bill / babylon item = ticking it on Home
function applyTick(it, a, day){
  if(it.key==='emergency'){ if(plan.emergency.done) return false; plan.emergency.done=true; plan.emergency.plan=a; corpus.emergency+=a; }
  else if(it.key.startsWith('sip')){ const s = plan.sips[+it.key.slice(3)]; if(!s||s.done) return false; s.done=true; s.plan=a; corpus.sip+=a; }
  else if(it.key.startsWith('prov')){ const x = plan.provisions[+it.key.slice(4)]; if(!x||x.done||plan.provDone) return false; x.done=true; x.plan=a; }
  else { if(paid[it.key]) return false; paid[it.key]={day, amt:a, by:me}; }
  saveCfg(); renderAll(); return true;
}

/* ---------- month view (current or closed months) ---------- */
let viewMonth = MKEY;
const viewCache = {};
const FIRST_MONTH = '2026-09';
function shiftMonth(key, n){ const [y,m] = key.split('-').map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function monthName(key){ const [y,m] = key.split('-').map(Number); return MONTHS[lang][m-1] + ' ' + y; }
async function loadMonth(key){
  if(key===MKEY || viewCache[key]) return;
  viewCache[key] = {loading:true};
  try{
    const r = await sb.from('months').select('data').eq('id', key).maybeSingle();
    const e = await sb.from('entries').select('*').eq('month', key).order('ts');
    const d = r.data ? r.data.data : null;
    viewCache[key] = { plan: d&&d.plan ? d.plan : JSON.parse(JSON.stringify(plan)), corpus: d&&d.corpus || corpus, paid: d&&d.paid || {}, entries: (e.data||[]).map(fromRow), baseline: !d };
    if(!d){ const P = viewCache[key].plan; P.emergency.done=false; P.sips.forEach(s=>s.done=false); P.provDone=false; P.provisions.forEach(x=>x.done=false); }
  }catch(err){ viewCache[key] = { plan: JSON.parse(JSON.stringify(plan)), corpus, paid:{}, entries:[], baseline:true }; }
  renderBook(); renderSnap();
}
function ds(){
  if(viewMonth===MKEY) return {key:MKEY, plan, corpus, paid, entries, live:true};
  const c = viewCache[viewMonth];
  if(!c || c.loading){ if(!c) loadMonth(viewMonth); return null; }
  return Object.assign({key:viewMonth, live:false}, c);
}
function calc(D){
  const P = D.plan, E = D.entries;
  const sum = (arr)=>arr.reduce((a,x)=>a+x.amt,0);
  const prov = P.provisions.reduce((a,p)=>a+p.plan,0);
  const sips = P.sips.reduce((a,s)=>a+s.plan,0);
  const babPlan = P.emergency.plan + sips + prov;
  const babTick = (P.emergency.done?P.emergency.plan:0) + P.sips.reduce((a,s)=>a+(s.done?s.plan:0),0) + provPaid(P);
  const babActual = babTick + sum(E.filter(e=>e.cat==='bab'));
  const fixPlan = P.fixed.reduce((a,f)=>a+(f.amt||0),0);
  const fixActual = Object.values(D.paid).reduce((a,p)=>a+(p.amt||0),0) + sum(E.filter(e=>e.cat==='fix'));
  const jars = P.jars.map(j=>({name:nm(j), plan:j.plan, actual:sum(E.filter(e=>e.cat==='var'&&e.catId===j.id))}));
  // per fixed item actuals (for the review)
  const fixItems = P.fixed.map(f=>({name:nm(f), plan:f.amt||0, actual:(D.paid[f.id]?D.paid[f.id].amt:0) + sum(E.filter(e=>e.cat==='fix'&&e.catId===f.id))}));
  const otherFix = sum(E.filter(e=>e.cat==='fix'&&(e.catId==='fix'||!P.fixed.find(f=>f.id===e.catId))));
  const totalPlan = babPlan + fixPlan + jars.reduce((a,j)=>a+j.plan,0);
  const out = babActual + fixActual + jars.reduce((a,j)=>a+j.actual,0);
  return {income:P.income, babPlan, babActual, fixPlan, fixActual, jars, fixItems, otherFix, totalPlan, out};
}
function renderMsw(id){
  const el = document.getElementById(id);
  const prevOk = viewMonth > FIRST_MONTH, nextOk = viewMonth < MKEY;
  el.innerHTML = `<button aria-label="previous month" ${prevOk?'':'disabled'} data-mv="-1">‹</button><div class="m">${monthName(viewMonth)}<small>${viewMonth===MKEY?t('current'):t('closed')}</small></div><button aria-label="next month" ${nextOk?'':'disabled'} data-mv="1">›</button>`;
  el.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{ viewMonth = shiftMonth(viewMonth, +b.dataset.mv); renderBook(); renderSnap(); });
}
function entryNameP(e, P){
  if(e.cat==='var'){ const j = P.jars.find(j=>j.id===e.catId); return j?nm(j):e.catId; }
  return e.note || t('fixedother');
}

  }).join('') : `<div class="card hint">${D.live?t('none'):t('noentries')}</div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{ if(confirm(t('confirmdel'))){ await delEntry(b.dataset.del); if(!D.live){ delete viewCache[D.key]; loadMonth(D.key); } toast(t('deleted')); } });

/* ---------- snapshot ---------- */
function renderSnap(){
  renderMsw('msw-snap');
  const D = ds();
  const rv = document.getElementById('review');
  if(!D){ rv.innerHTML = `<div class="hint">${t('loading')}</div>`; return; }
  const P = D.plan, C = calc(D);
  document.getElementById('snap-sub').textContent = inr(P.income) + (D.baseline ? ' · ' + t('baseline') : '');
  const inc = P.income, e = P.emergency.plan, s = P.sips.reduce((a,x)=>a+x.plan,0), p = P.provisions.reduce((a,x)=>a+x.plan,0), f = C.fixPlan;
  // review card
  const left = inc - C.out;
  const lines = [{n:t('babylon').split(' ')[0], pl:C.babPlan, ac:C.babActual, sav:true}, {n:t('fixed'), pl:C.fixPlan, ac:C.fixActual}]
    .concat(C.jars.map(j=>({n:j.name, pl:j.plan, ac:j.actual})));
  const spendLines = lines.filter(l=>!l.sav);
  const overs = spendLines.filter(l=>l.ac>l.pl).sort((a,b)=>(b.ac-b.pl)-(a.ac-a.pl)).slice(0,3);
  const unders = spendLines.filter(l=>l.ac<l.pl && l.ac>0).sort((a,b)=>(b.pl-b.ac)-(a.pl-a.ac)).slice(0,3);
  const fixOver = C.fixItems.filter(x=>x.actual>x.plan && x.plan>0).sort((a,b)=>(b.actual-b.plan)-(a.actual-a.plan)).slice(0,3);
  const sr = inc>0 ? Math.round((C.babActual + Math.max(0,left))/inc*100) : 0;
  rv.innerHTML = `<div class="sec-h"><div class="t">${t('review')} · ${monthName(D.key)}</div></div>
    <div class="big"><span>${t('spent')}</span><span class="v num">${inr(C.out)}</span></div>
    <div class="big"><span>${t('saved2')}</span><span class="v num" style="color:${left<0?'var(--orange)':'var(--blue)'}">${left<0?'−':''}${inr(Math.abs(left))}</span></div>
    <div class="li"><span>${t('savrate')} (${t('babylon').split(' ')[0]} + ${t('saved2').split(' / ')[1]||'left'})</span><span class="num">${sr}%</span></div>
    <h3 style="color:var(--orange)">${t('over')}</h3>
    ${overs.length ? overs.map(l=>`<div class="li"><span>${l.n}</span><span class="num" style="color:var(--orange)">+${(l.ac-l.pl).toLocaleString('en-IN')}</span></div>`).join('') : `<div class="li"><span class="hint">${t('nothingover')}</span></div>`}
    ${fixOver.map(x=>`<div class="li"><span>· ${x.name}</span><span class="num" style="color:var(--orange)">+${(x.actual-x.plan).toLocaleString('en-IN')}</span></div>`).join('')}
    ${C.otherFix ? `<div class="li"><span>· ${t('other')}</span><span class="num">${C.otherFix.toLocaleString('en-IN')}</span></div>` : ''}
    <h3 style="color:var(--blue)">${t('under')}</h3>
    ${unders.length ? unders.map(l=>`<div class="li"><span>${l.n}</span><span class="num" style="color:var(--blue)">−${(l.pl-l.ac).toLocaleString('en-IN')}</span></div>`).join('') : `<div class="li"><span class="hint">—</span></div>`}`;
  // cascade
  const steps = [[t('inc'),0,inc],[t('emer'),e,inc-e],[t('sip'),s,inc-e-s],[t('prov'),p,inc-e-s-p],[t('fixed'),f,inc-e-s-p-f]];
  document.getElementById('cascade').innerHTML = steps.map(([n,m,l],i)=>`<div class="step"><div class="l"><span>${n}</span><span class="num" style="color:var(--muted)">${m?'−'+m.toLocaleString('en-IN'):''}</span></div><div class="bar"><div class="tr"><div class="fl ${i===4?'w':''}" style="width:${Math.max(0,l/inc*100)}%"></div></div><span class="v num">${l.toLocaleString('en-IN')}</span></div></div>`).join('')
    + `<div class="hint" style="text-align:left">${t('room')}: <b class="num">${inr(inc-e-s-p-f)}</b></div>`;
  const room = inc-e-s-p-f, need = P.jars.reduce((a,j)=>a+j.plan,0), g = room-need;
  const gb = document.getElementById('gapbox');
  gb.innerHTML = `<div><div style="font-weight:700">${t('gapt')}</div><div class="hint" style="text-align:left">${t('room')} ${inr(room)} · ${t('plan')} ${inr(need)}</div></div><div class="v num">${g<0?'−':'+'}${inr(Math.abs(g)).slice(1)}</div>`;
  gb.style.borderColor = g<0?'var(--orange)':'var(--blue)'; gb.querySelector('.v').style.color = g<0?'var(--orange)':'var(--blue)';
  const gapc = (pl,ac) => { const d = pl-ac; return `<span class="num" style="color:${d<0?'var(--orange)':'var(--muted)'}">${d<0?'−':'+'}${Math.abs(d).toLocaleString('en-IN')}</span>`; };
  document.getElementById('pva').innerHTML = `<div class="r h"><span>${t('category')}</span><span>${t('plan')}</span><span>${t('actual')}</span><span>${t('gap')}</span></div>` + lines.map(l=>`<div class="r"><span>${l.n}</span><span class="num">${l.pl.toLocaleString('en-IN')}</span><span class="num">${l.ac.toLocaleString('en-IN')}</span>${gapc(l.pl,l.ac)}</div>`).join('')
    + `<div class="r" style="font-weight:700"><span>${t('sumtotal')}</span><span class="num">${C.totalPlan.toLocaleString('en-IN')}</span><span class="num">${C.out.toLocaleString('en-IN')}</span>${gapc(C.totalPlan, C.out)}</div>`;

  const fld = (label, id, val, cls='') => `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="${cls}" inputmode="${cls.includes('txt')?'text':'numeric'}" value="${val}"></div>`;
  document.getElementById('f-income').innerHTML = fld(t('income'),'in-income',plan.income);
  document.getElementById('f-bab').innerHTML = fld(t('emer'),'in-emer',plan.emergency.plan) + plan.sips.map((s,i)=>`<div class="field"><input class="txt" id="in-sipn${i}" value="${s.name}" aria-label="${t('sipn')}"><input id="in-sip${i}" inputmode="numeric" value="${s.plan}"></div>`).join('') + plan.provisions.map((p,i)=>fld(t(p.key),'in-prov'+i,p.plan)).join('');
  document.getElementById('f-corpus').innerHTML = fld(t('emerg'),'in-c-emer',corpus.emergency) + fld(t('sip'),'in-c-sip',corpus.sip);
  document.getElementById('f-fixed').innerHTML = plan.fixed.map((f,i)=>`<div class="field"><input class="txt" id="in-fn${i}" value="${nm(f)}" aria-label="${t('name')}"><input class="sm" id="in-fd${i}" inputmode="numeric" value="${f.due||''}" placeholder="${t('duedate')}" aria-label="${t('duedate')}"><input id="in-fa${i}" inputmode="numeric" value="${f.amt||''}" aria-label="${t('amount')}"></div>`).join('');
  document.getElementById('f-jars').innerHTML = plan.jars.map((j,i)=>fld(nm(j),'in-jar'+i,j.plan)).join('');
}
document.getElementById('l-hi').onclick = ()=>setLang('hi'); document.getElementById('l-en').onclick = ()=>setLang('en');
function setLang(l){ lang=l; try{localStorage.setItem('gl-lang',l);}catch(e){} renderAll(); }
document.getElementById('add-fixed').onclick = ()=>{ const n = prompt(lang==='hi'?'नया तय खर्च का नाम':'Name of new fixed item'); if(!n) return; plan.fixed.push({id:'f'+Date.now(), name:n, hi:n, amt:0, due:0, kind:'once'}); renderSettings(); };
document.getElementById('save-set').onclick = ()=>{
  const v = id => parseInt(document.getElementById(id).value,10)||0;
  plan.income = v('in-income'); plan.emergency.plan = v('in-emer');
  plan.sips.forEach((s,i)=>{ s.name = document.getElementById('in-sipn'+i).value || s.name; s.plan = v('in-sip'+i); });
  plan.provisions.forEach((p,i)=>p.plan=v('in-prov'+i));
  corpus.emergency = v('in-c-emer'); corpus.sip = v('in-c-sip');
  plan.fixed.forEach((f,i)=>{ const n = document.getElementById('in-fn'+i).value; if(lang==='hi') f.hi=n; else f.name=n; f.due=v('in-fd'+i); f.amt=v('in-fa'+i); });
  plan.jars.forEach((j,i)=>j.plan=v('in-jar'+i));
  saveCfg(); renderAll(); toast('✓ ' + t('settingssaved')); go('home');
};

/* ---------- nav + toast ---------- */
function go(s){ document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on', x.id==='s-'+s)); document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.s===s)); window.scrollTo(0,0); if(s==='log') renderLog(); }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.s));
let toastT; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200); }

renderAll(); initStore();
</script>
</body>
</html>
